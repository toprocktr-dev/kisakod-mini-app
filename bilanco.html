<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AYLIK BİLANÇO</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:10px;
    font-family:Arial,Helvetica,sans-serif;
    background:#eeeeee;
    color:#000;
}

.container{
    max-width:1500px;
    margin:auto;
    background:#fff;
    padding:10px;
    border-radius:8px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.baslik{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    margin-bottom:8px;
}


/* =====================================================
   ÜST BİLGİLER
===================================================== */

.ust-bilgi{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    flex-wrap:nowrap;
    margin-bottom:10px;
    overflow-x:auto;
}

.kutu{
    display:flex;
    align-items:center;
    gap:4px;
    height:32px;
    padding:3px 7px;
    border:1px solid #888;
    background:#f7f7f7;
    border-radius:4px;
    white-space:nowrap;
    font-size:12px;
    font-weight:bold;
}

.kutu input,
.kutu select{
    height:24px;
    border:1px solid #aaa;
    background:#fff;
    padding:2px 4px;
    font-size:12px;
    font-weight:normal;
    outline:none;
}

#ay{
    width:95px;
}

#yil{
    width:60px;
}

#calismaGunu{
    width:55px;
    text-align:center;
}

#butce,
#hedef{
    width:90px;
}


/* =====================================================
   TABLO
===================================================== */

.tablo-alan{
    width:100%;
    overflow-x:auto;
}

table{
    border-collapse:collapse;
    width:100%;
    min-width:1100px;
    table-layout:fixed;
}

th,
td{
    border:1px solid #777;
    padding:4px;
    text-align:center;
    height:27px;
    font-size:12px;
}

thead tr:nth-child(1) th{
    background:#d9e2f3;
    font-weight:bold;
}

thead tr:nth-child(2) th{
    background:#e2efda;
    font-weight:bold;
}

thead th{
    vertical-align:middle;
}


/* =====================================================
   PLAN GİRİŞLERİ
===================================================== */

.plan-giris{
    background:#fffde8;
}

.plan-giris input{
    width:100%;
    height:22px;
    border:0;
    outline:none;
    background:#fffde8;
    text-align:center;
    font-size:12px;
}


/* =====================================================
   DİĞER GİRİŞLER
===================================================== */

.giris{
    background:#fffde8;
}

.giris input{
    width:100%;
    height:22px;
    border:0;
    outline:none;
    background:#fffde8;
    text-align:center;
    font-size:12px;
}


/* =====================================================
   NORMAL HÜCRELER
===================================================== */

.tarih{
    background:#f2f2f2;
    font-weight:bold;
}

.gun{
    background:#f2f2f2;
    font-weight:bold;
}

.kumulatif{
    background:#f2f2f2;
}

.performans{
    background:#e2f0d9;
    font-weight:bold;
}


/* =====================================================
   TOPLAM
===================================================== */

.toplam td{
    background:#d9ead3;
    font-weight:bold;
    font-size:12px;
}


/* =====================================================
   HEDEF TOPLAM
===================================================== */

.hedef-toplam td{
    background:#cfe2f3;
    font-weight:bold;
    font-size:13px;
}


/* =====================================================
   HAFTA SONU
===================================================== */

.hafta-sonu{
    background:#fce4d6 !important;
}


/* =====================================================
   DURUM
===================================================== */

#durum{
    margin-top:8px;
    font-weight:bold;
    font-size:12px;
}


/* =====================================================
   MOBİL
===================================================== */

@media(max-width:700px){

    body{
        padding:4px;
    }

    .container{
        padding:5px;
    }

    .baslik{
        font-size:17px;
    }

    .ust-bilgi{
        justify-content:flex-start;
    }

    .kutu{
        font-size:11px;
        height:30px;
    }

    table{
        min-width:1100px;
    }

    th,
    td{
        font-size:10px;
        padding:3px;
    }

}

</style>
</head>


<body>

<div class="container">


<div class="baslik">
    AYLIK BİLANÇO
</div>


<!-- =====================================================
     ÜST BİLGİLER
===================================================== -->

<div class="ust-bilgi">


    <!-- AY -->

    <div class="kutu">

        <span>AY:</span>

        <select id="ay">

            <option value="1">OCAK</option>
            <option value="2">ŞUBAT</option>
            <option value="3" selected>MART</option>
            <option value="4">NİSAN</option>
            <option value="5">MAYIS</option>
            <option value="6">HAZİRAN</option>
            <option value="7">TEMMUZ</option>
            <option value="8">AĞUSTOS</option>
            <option value="9">EYLÜL</option>
            <option value="10">EKİM</option>
            <option value="11">KASIM</option>
            <option value="12">ARALIK</option>

        </select>

    </div>


    <!-- YIL -->

    <div class="kutu">

        <span>YIL:</span>

        <input
            id="yil"
            type="number"
            value="2026"
        >

    </div>


    <!-- ÇALIŞMA GÜNÜ -->

    <div class="kutu">

        <span>ÇALIŞMA GÜNÜ:</span>

        <input
            id="calismaGunu"
            type="number"
            min="1"
            value="31"
        >

    </div>


    <!-- BÜTÇE -->

    <div class="kutu">

        <span>BÜTÇE:</span>

        <input
            id="butce"
            type="number"
        >

    </div>


    <!-- HEDEF -->

    <div class="kutu">

        <span>HEDEF:</span>

        <input
            id="hedef"
            type="number"
        >

    </div>


</div>


<!-- =====================================================
     TABLO
===================================================== -->

<div class="tablo-alan">

<table>


<thead>

<tr>

    <th rowspan="2">TARİH</th>

    <th rowspan="2">GÜN</th>

    <th colspan="2">CİRO</th>

    <th colspan="3">KÜMÜLATİF CİRO</th>

    <th colspan="2">ÇALIŞMA SAATİ</th>

    <th colspan="2">KÜMÜLATİF SAAT</th>

    <th colspan="2">KÜMÜLATİF PERFORMANS</th>

    <th colspan="2">MÜŞTERİ</th>

</tr>


<tr>

    <th>PLANLANAN</th>
    <th>OLAN</th>

    <th>PLANLANAN</th>
    <th>OLAN</th>
    <th>ORTALAMA</th>

    <th>PLAN</th>
    <th>OLAN</th>

    <th>PLAN</th>
    <th>OLAN</th>

    <th>PLAN</th>
    <th>OLAN</th>

    <th>GÜN</th>
    <th>KÜMÜLATİF</th>

</tr>

</thead>


<tbody id="tablo"></tbody>


<tfoot>


<!-- =====================================================
     TOPLAM
===================================================== -->

<tr class="toplam">

    <td colspan="2">
        TOPLAM
    </td>

    <td id="toplamCiroPlan">
        0
    </td>

    <td id="toplamCiroOlan">
        0
    </td>

    <td id="toplamKumPlan">
        0
    </td>

    <td id="toplamKumOlan">
        0
    </td>

    <td>
        0
    </td>

    <td id="toplamSaatPlan">
        0
    </td>

    <td id="toplamSaatOlan">
        0
    </td>

    <td id="toplamKumSaatPlan">
        0
    </td>

    <td id="toplamKumSaatOlan">
        0
    </td>

    <td>
        0
    </td>

    <td>
        0
    </td>

    <td>
        0
    </td>

    <td>
        0
    </td>

</tr>


<!-- =====================================================
     HEDEF TOPLAM
===================================================== -->

<tr class="hedef-toplam">

    <td colspan="2">
        HEDEF TOPLAM
    </td>

    <td id="hedefToplam">
        0
    </td>

    <td colspan="12">
        ÇALIŞMA GÜNÜ × HEDEF
    </td>

</tr>


</tfoot>

</table>

</div>


<div id="durum"></div>


</div>


<script>


/* =====================================================
   AYLAR
===================================================== */

const aylar = [

    "OCAK",
    "ŞUBAT",
    "MART",
    "NİSAN",
    "MAYIS",
    "HAZİRAN",
    "TEMMUZ",
    "AĞUSTOS",
    "EYLÜL",
    "EKİM",
    "KASIM",
    "ARALIK"

];


/* =====================================================
   TAM SAYI FORMAT
===================================================== */

function sayiFormat(deger){

    if(
        deger === null ||
        deger === undefined ||
        deger === "" ||
        isNaN(deger)
    ){

        return "0";

    }

    return Math.round(
        Number(deger)
    ).toLocaleString("tr-TR");

}


/* =====================================================
   TARİH
===================================================== */

function tarihFormat(tarih){

    return tarih.toLocaleDateString(
        "tr-TR",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }
    );

}


/* =====================================================
   GÜN
===================================================== */

function gunAdi(tarih){

    const gunler = [

        "PAZAR",
        "PAZARTESİ",
        "SALI",
        "ÇARŞAMBA",
        "PERŞEMBE",
        "CUMA",
        "CUMARTESİ"

    ];

    return gunler[
        tarih.getDay()
    ];

}


/* =====================================================
   TABLO OLUŞTUR
===================================================== */

function tabloOlustur(){

    const ay =
        Number(
            document.getElementById(
                "ay"
            ).value
        );


    const yil =
        Number(
            document.getElementById(
                "yil"
            ).value
        );


    /*
       Ay değiştiğinde çalışma günü
       otomatik olarak gerçek ay gününe
       ayarlanır.
    */

    const otomatikGun =
        new Date(
            yil,
            ay,
            0
        ).getDate();


    /*
       Sadece ilk oluşturulurken
       otomatik gün değerini yaz.
    */

    const mevcutGun =
        document.getElementById(
            "calismaGunu"
        ).value;


    if(
        !mevcutGun ||
        mevcutGun === "0"
    ){

        document.getElementById(
            "calismaGunu"
        ).value =
            otomatikGun;

    }


    const gunSayisi =
        otomatikGun;


    const body =
        document.getElementById(
            "tablo"
        );


    body.innerHTML = "";


    /*
       Tablo her zaman ayın gerçek
       günlerini oluşturur.
    */

    for(
        let i = 1;
        i <= gunSayisi;
        i++
    ){

        const tarih =
            new Date(
                yil,
                ay - 1,
                i
            );


        const gun =
            gunAdi(tarih);


        const tr =
            document.createElement("tr");


        if(
            tarih.getDay() === 0 ||
            tarih.getDay() === 6
        ){

            tr.classList.add(
                "hafta-sonu"
            );

        }


        tr.innerHTML = `

<td class="tarih">
    ${tarihFormat(tarih)}
</td>


<td class="gun">
    ${gun}
</td>


<td class="plan-giris">

    <input
        type="number"
        class="ciro-plan"
        data-gun="${i}"
    >

</td>


<td class="giris">

    <input
        type="number"
        class="ciro-olan"
        data-gun="${i}"
    >

</td>


<td class="kumulatif kum-ciro-plan">
    0
</td>


<td class="kumulatif kum-ciro-olan">
    0
</td>


<td class="kumulatif ciro-ortalama">
    0
</td>


<td class="plan-giris">

    <input
        type="number"
        class="saat-plan"
        data-gun="${i}"
    >

</td>


<td class="giris">

    <input
        type="number"
        class="saat-olan"
        data-gun="${i}"
    >

</td>


<td class="kumulatif kum-saat-plan">
    0
</td>


<td class="kumulatif kum-saat-olan">
    0
</td>


<td class="performans performans-plan">
    0
</td>


<td class="performans performans-olan">
    0
</td>


<td class="giris">

    <input
        type="number"
        class="musteri"
        data-gun="${i}"
    >

</td>


<td class="kumulatif kum-musteri">
    0
</td>

`;


        body.appendChild(tr);

    }


    /*
       Tablo girişlerini dinle
    */

    document
    .querySelectorAll(
        "#tablo input"
    )
    .forEach(
        input => {

            input.addEventListener(
                "input",
                hesapla
            );

        }
    );


    hesapla();

}


/* =====================================================
   HESAPLAMA
===================================================== */

function hesapla(){

    let kumCiroPlan = 0;

    let kumCiroOlan = 0;

    let kumSaatPlan = 0;

    let kumSaatOlan = 0;

    let kumMusteri = 0;


    let toplamCiroPlan = 0;

    let toplamCiroOlan = 0;

    let toplamSaatPlan = 0;

    let toplamSaatOlan = 0;


    const satirlar =
        document.querySelectorAll(
            "#tablo tr"
        );


    satirlar.forEach(
        (tr,index) => {


            const ciroPlan =
                Number(
                    tr.querySelector(
                        ".ciro-plan"
                    ).value
                ) || 0;


            const ciroOlan =
                Number(
                    tr.querySelector(
                        ".ciro-olan"
                    ).value
                ) || 0;


            const saatPlan =
                Number(
                    tr.querySelector(
                        ".saat-plan"
                    ).value
                ) || 0;


            const saatOlan =
                Number(
                    tr.querySelector(
                        ".saat-olan"
                    ).value
                ) || 0;


            const musteri =
                Number(
                    tr.querySelector(
                        ".musteri"
                    ).value
                ) || 0;


            kumCiroPlan +=
                ciroPlan;


            kumCiroOlan +=
                ciroOlan;


            kumSaatPlan +=
                saatPlan;


            kumSaatOlan +=
                saatOlan;


            kumMusteri +=
                musteri;


            toplamCiroPlan +=
                ciroPlan;


            toplamCiroOlan +=
                ciroOlan;


            toplamSaatPlan +=
                saatPlan;


            toplamSaatOlan +=
                saatOlan;


            /*
               KÜMÜLATİF CİRO
            */

            tr.querySelector(
                ".kum-ciro-plan"
            ).textContent =
                sayiFormat(
                    kumCiroPlan
                );


            tr.querySelector(
                ".kum-ciro-olan"
            ).textContent =
                sayiFormat(
                    kumCiroOlan
                );


            /*
               ORTALAMA
            */

            const ortalama =
                (index + 1) > 0
                ?
                kumCiroOlan /
                (index + 1)
                :
                0;


            tr.querySelector(
                ".ciro-ortalama"
            ).textContent =
                sayiFormat(
                    ortalama
                );


            /*
               KÜMÜLATİF SAAT
            */

            tr.querySelector(
                ".kum-saat-plan"
            ).textContent =
                sayiFormat(
                    kumSaatPlan
                );


            tr.querySelector(
                ".kum-saat-olan"
            ).textContent =
                sayiFormat(
                    kumSaatOlan
                );


            /*
               PERFORMANS PLAN
            */

            const performansPlan =
                kumSaatPlan > 0
                ?
                kumCiroPlan /
                kumSaatPlan
                :
                0;


            tr.querySelector(
                ".performans-plan"
            ).textContent =
                sayiFormat(
                    performansPlan
                );


            /*
               PERFORMANS OLAN
            */

            const performansOlan =
                kumSaatOlan > 0
                ?
                kumCiroOlan /
                kumSaatOlan
                :
                0;


            tr.querySelector(
                ".performans-olan"
            ).textContent =
                sayiFormat(
                    performansOlan
                );


            /*
               KÜMÜLATİF MÜŞTERİ
            */

            tr.querySelector(
                ".kum-musteri"
            ).textContent =
                sayiFormat(
                    kumMusteri
                );

        }
    );


    /*
       TOPLAM SATIRI
    */

    document.getElementById(
        "toplamCiroPlan"
    ).textContent =
        sayiFormat(
            toplamCiroPlan
        );


    document.getElementById(
        "toplamCiroOlan"
    ).textContent =
        sayiFormat(
            toplamCiroOlan
        );


    document.getElementById(
        "toplamKumPlan"
    ).textContent =
        sayiFormat(
            toplamCiroPlan
        );


    document.getElementById(
        "toplamKumOlan"
    ).textContent =
        sayiFormat(
            toplamCiroOlan
        );


    document.getElementById(
        "toplamSaatPlan"
    ).textContent =
        sayiFormat(
            toplamSaatPlan
        );


    document.getElementById(
        "toplamSaatOlan"
    ).textContent =
        sayiFormat(
            toplamSaatOlan
        );


    document.getElementById(
        "toplamKumSaatPlan"
    ).textContent =
        sayiFormat(
            toplamSaatPlan
        );


    document.getElementById(
        "toplamKumSaatOlan"
    ).textContent =
        sayiFormat(
            toplamSaatOlan
        );


    /* =================================================
       HEDEF TOPLAM

       FORMÜL:

       ÇALIŞMA GÜNÜ × HEDEF
    ================================================= */

    const calismaGunu =
        Number(
            document.getElementById(
                "calismaGunu"
            ).value
        ) || 0;


    const hedef =
        Number(
            document.getElementById(
                "hedef"
            ).value
        ) || 0;


    const hedefToplam =
        calismaGunu * hedef;


    document.getElementById(
        "hedefToplam"
    ).textContent =
        sayiFormat(
            hedefToplam
        );

}


/* =====================================================
   AY DEĞİŞİNCE
===================================================== */

document.getElementById("ay")
.addEventListener(
    "change",
    function(){

        const ay =
            Number(this.value);

        const yil =
            Number(
                document.getElementById(
                    "yil"
                ).value
            );


        const gun =
            new Date(
                yil,
                ay,
                0
            ).getDate();


        /*
           Ay değişince otomatik gün sayısı
           gelir ama kullanıcı daha sonra
           bunu değiştirebilir.
        */

        document.getElementById(
            "calismaGunu"
        ).value =
            gun;


        tabloOlustur();

    }
);


/* =====================================================
   YIL DEĞİŞİNCE
===================================================== */

document.getElementById("yil")
.addEventListener(
    "change",
    function(){

        const ay =
            Number(
                document.getElementById(
                    "ay"
                ).value
            );


        const yil =
            Number(this.value);


        const gun =
            new Date(
                yil,
                ay,
                0
            ).getDate();


        document.getElementById(
            "calismaGunu"
        ).value =
            gun;


        tabloOlustur();

    }
);


/* =====================================================
   ÇALIŞMA GÜNÜ DEĞİŞİNCE
===================================================== */

document.getElementById(
    "calismaGunu"
)
.addEventListener(
    "input",
    hesapla
);


/* =====================================================
   HEDEF DEĞİŞİNCE
===================================================== */

document.getElementById(
    "hedef"
)
.addEventListener(
    "input",
    hesapla
);


/* =====================================================
   BAŞLAT
===================================================== */

tabloOlustur();

</script>

</body>
</html>
