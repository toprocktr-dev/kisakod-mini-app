<script>
/*************************************************
 * API
 *************************************************/

const API_URL =
  "https://script.google.com/macros/s/AKfycbwfh8M8RUYOgEnoq4a4b7MCg8TwaKPTRaC2Eros9zy-JFoatnNU3LyJfuT0ISDo62lm4g/exec";

/*************************************************
 * ELEMENTLER
 *************************************************/

const searchInput =
  document.getElementById("searchInput");

const searchButton =
  document.getElementById("searchButton");

const barcodeButton =
  document.getElementById("barcodeButton");

const favoriteButton =
  document.getElementById("favoriteButton");

const favoriteCount =
  document.getElementById("favoriteCount");

const favoritesModal =
  document.getElementById("favoritesModal");

const favoritesResults =
  document.getElementById("favoritesResults");

const favoritesStatus =
  document.getElementById("favoritesStatus");

const detailFavoriteButton =
  document.getElementById("detailFavoriteButton");

let seciliUrun = null;
const FAVORITES_STORAGE_KEY = "kisakod_plus_favorites_v1";
let favoriUrunler = favorileriYukle();

function favorileriYukle() {
  try {
    const kayit = localStorage.getItem(FAVORITES_STORAGE_KEY);
    const liste = kayit ? JSON.parse(kayit) : [];
    return Array.isArray(liste) ? liste : [];
  } catch (e) {
    console.warn("Favoriler okunamadı:", e);
    return [];
  }
}

function urunFavoriAnahtari(urun) {
  if (!urun) return "";
  return String(urun.urunKodu || urun.barkod || urun.kod || urun.link || "");
}

function urunFavorideMi(urun) {
  const anahtar = urunFavoriAnahtari(urun);
  return !!anahtar && favoriUrunler.some(function(item) {
    return urunFavoriAnahtari(item) === anahtar;
  });
}

function favorileriKaydet() {
  try {
    localStorage.setItem(FAVORITES_STORAGE_KEY, JSON.stringify(favoriUrunler));
  } catch (e) {
    console.warn("Favoriler kaydedilemedi:", e);
    alert("Favoriler bu cihazda kaydedilemedi. Tarayıcı depolama alanını kontrol edin.");
  }
  favoriSayisiniGuncelle();
}

function favoriSayisiniGuncelle() {
  favoriteCount.textContent = String(favoriUrunler.length);
  favoriteCount.style.display = "flex";
}

function favoriDurumunuGuncelle() {
  if (!seciliUrun) return;
  const favoride = urunFavorideMi(seciliUrun);
  detailFavoriteButton.textContent = favoride
    ? "★ Favorilerden çıkar"
    : "☆ Favorilere ekle";
  detailFavoriteButton.style.background = favoride ? "#fff0c2" : "#fff8e6";
}

function favoriDegistir(urun) {
  const anahtar = urunFavoriAnahtari(urun);
  if (!anahtar) {
    alert("Bu ürün favorilere eklenemedi; ürün kodu bulunamadı.");
    return;
  }

  const mevcutIndex = favoriUrunler.findIndex(function(item) {
    return urunFavoriAnahtari(item) === anahtar;
  });

   if (mevcutIndex >= 0) {
    // Favoride varsa listeden çıkar.
    favoriUrunler.splice(mevcutIndex, 1);
  } else {
    // En fazla 10 favori ürün eklenebilir.
    if (favoriUrunler.length >= 10) {
      alert("⭐ En fazla 10 ürün favorilere ekleyebilirsiniz.");
      return;
    }

    favoriUrunler.push(urun);
  }

  favorileriKaydet();
  favoriDurumunuGuncelle();
  mevcutKartYildizlariniGuncelle();

  if (favoritesModal.style.display === "flex") {
    favoriListesiniGoster();
  }
}

function mevcutKartYildizlariniGuncelle() {
  document.querySelectorAll(".product-favorite-button").forEach(function(button) {
    const anahtar = button.dataset.favoriteKey || "";
    const favoride = favoriUrunler.some(function(item) {
      return urunFavoriAnahtari(item) === anahtar;
    });
    button.textContent = favoride ? "★" : "☆";
    button.classList.toggle("is-favorite", favoride);
    button.setAttribute("aria-label", favoride ? "Favorilerden çıkar" : "Favorilere ekle");
  });
}

function favoriListesiniGoster() {
  favoritesResults.innerHTML = "";
  favoritesStatus.textContent = favoriUrunler.length
    ? favoriUrunler.length + " favori ürün"
    : "Favori listen henüz boş.";

  if (!favoriUrunler.length) {
    const empty = document.createElement("div");
    empty.className = "favorites-empty";
    empty.textContent = "⭐ Henüz favori ürün eklemedin. Ürün kartındaki yıldız simgesine dokunarak ürünleri buraya kaydedebilirsin.";
    favoritesResults.appendChild(empty);
    return;
  }

  favoriUrunler.forEach(function(urun) {
    favoritesResults.appendChild(urunKartiOlustur(urun, true));
  });
}

function favoriPenceresiniAc() {
  favoriListesiniGoster();
  favoritesModal.style.display = "flex";
}

function favoriPenceresiniKapat() {
  favoritesModal.style.display = "none";
}

const results =
  document.getElementById("results");

const status =
  document.getElementById("status");

const loadingScreen =
  document.getElementById("loadingScreen");

const loadingTitle =
  document.getElementById("loadingTitle");

const loadingDescription =
  document.getElementById("loadingDescription");

/*************************************************
 * YÜKLENME EKRANI
 *************************************************/

function progressGoster(baslik, aciklama) {
  results.innerHTML = "";

  loadingTitle.textContent = baslik;
  loadingDescription.textContent =
    aciklama || "Lütfen bekleyin.";

  loadingScreen.style.display = "flex";
}

function progressGizle() {
  loadingScreen.style.display = "none";
}

/*************************************************
 * ÜRÜNLERİ BİR KEZ YÜKLE — SPOT_ÜRÜNLER
 *************************************************/
let tumUrunVerisi = [];
let urunVerisiHazir = false;

async function urunleriYukle() {
  progressGoster("Bağlantı kuruluyor...", "Ürün listesine erişiliyor. Lütfen bekleyin.");
  try {
    const url = API_URL + "?func=" + encodeURIComponent("SPOT_ÜRÜNLER");
    loadingTitle.textContent = "Ürünler yükleniyor...";
    loadingDescription.textContent = "Ürün listesi hazırlanıyor. Bu işlem biraz sürebilir.";

    const response = await fetch(url, { cache: "no-store" });
    if (!response.ok) throw new Error("Sunucu yanıt vermedi: " + response.status);
    const data = await response.json();
    if (!Array.isArray(data)) throw new Error("Ürün verisi geçersiz.");

    // İlk satır başlık satırı kabul edilir.
    tumUrunVerisi = data.slice(1).map(function(row) {
      return {
        urunKodu: String(row[0] ?? ""),
        kod: String(row[1] ?? ""),
        fiyat: String(row[2] ?? ""),
        tarih: String(row[3] ?? ""),
        link: String(row[4] ?? ""),
        barkod: String(row[5] ?? "")
      };
    });

    urunVerisiHazir = true;
    status.textContent = tumUrunVerisi.length.toLocaleString("tr-TR") + " ürün yüklendi. Aramaya hazır.";
  } catch (error) {
    console.error("Ürün yükleme hatası:", error);
    status.textContent = "❌ Ürünler yüklenemedi.";
    results.innerHTML = '<div class="empty">Ürün listesi alınamadı. İnternet bağlantısını kontrol edip sayfayı yenileyin.</div>';
  } finally {
    progressGizle();
  }
}

let sonArama = "";
// SON 4 ARAMAYI KAYDET VE GÖSTER
function sonAramalariGoster() {
  const alan = document.getElementById("recentSearches");
  const liste = JSON.parse(
    localStorage.getItem("kisakod_son_aramalar") || "[]"
  );

  if (!liste.length) {
    alan.style.display = "none";
    return;
  }

  alan.innerHTML = liste.map((urun, index) => `
    <div class="recent-search-item"
         onclick="sonAramayiSec(${index})">
      🕘 ${urun.replace(/</g, "&lt;").replace(/>/g, "&gt;")}
    </div>
  `).join("");

  alan.style.display = "block";
}

function sonAramayiKaydet(query) {
  let liste = JSON.parse(
    localStorage.getItem("kisakod_son_aramalar") || "[]"
  );

  liste = liste.filter(x => x !== query);
  liste.unshift(query);
  liste = liste.slice(0, 4);

  localStorage.setItem(
    "kisakod_son_aramalar",
    JSON.stringify(liste)
  );
}

function sonAramayiSec(index) {
  const liste = JSON.parse(
    localStorage.getItem("kisakod_son_aramalar") || "[]"
  );

  if (!liste[index]) return;

  searchInput.value = liste[index];

  document.getElementById("recentSearches").style.display = "none";

  searchProducts(true);
}
function searchProducts(force = false) {
  const query = String(searchInput.value || "").trim().toLocaleLowerCase("tr-TR");
  if (!query) { results.innerHTML = ""; status.textContent = ""; return; }
  if (query.length < 3) {
    results.innerHTML = "";
    status.textContent = "🔎 Arama yapmak için en az 3 harf yazın.";
    return;
  }
  if (!urunVerisiHazir) { status.textContent = "Ürün listesi henüz yüklenmedi."; return; }
  if (!force && query === sonArama) return;

  sonArama = query;
  sonAramayiKaydet(query);
  document.getElementById("recentSearches").style.display = "none";
  searchButton.disabled = true;
  progressGoster("Ürünler aranıyor...", "Ürünler cihazınızda aranıyor.");
  try {
    const bulunanlar = tumUrunVerisi.filter(function(urun) {
      const metin = [urun.kod, urun.urunKodu, urun.fiyat, urun.tarih, urun.barkod]
        .join(" ").toLocaleLowerCase("tr-TR");
      return metin.includes(query);
    });
    renderResults(bulunanlar);
  } finally {
    progressGizle();
    searchButton.disabled = false;
  }
}

/*************************************************
 * SONUÇLARI GÖSTER
 *************************************************/

let tumUrunler = [];
let gosterilenUrunSayisi = 0;

const ILK_GOSTERIM = 20;
const SONRAKI_GOSTERIM = 10;

function renderResults(data) {
  results.innerHTML = "";

  tumUrunler = Array.isArray(data)
    ? data
    : [];

  gosterilenUrunSayisi = 0;

  if (tumUrunler.length === 0) {
    status.textContent = "❌ Ürün bulunamadı.";

    results.innerHTML =
      '<div class="empty">Ürün bulunamadı.</div>';

    return;
  }

  status.textContent =
    tumUrunler.length + " ürün bulundu.";

  sonrakiUrunleriGoster(ILK_GOSTERIM);
}



function urunKartiOlustur(urun, favoriPenceresinde) {
  const card = document.createElement("div");
  card.className = "product-card";

  const img = document.createElement("img");
  img.className = "product-image";
  img.alt = urun.kod || "Ürün";
  if (urun.link) {
    img.src = urun.link;
  } else {
    img.style.visibility = "hidden";
  }

  const info = document.createElement("div");
  info.className = "product-info";

  const name = document.createElement("div");
  name.className = "product-name";
  name.textContent = urun.kod || "Ürün";

  const code = document.createElement("div");
  code.className = "product-code";
  code.textContent = "🔢 Kod: " + (urun.urunKodu || "");

  const price = document.createElement("div");
  price.className = "product-price";
  price.textContent = "💰 Fiyat: " + (urun.fiyat || "");

  const date = document.createElement("div");
  date.className = "product-date";
  date.textContent = "📅 Satış Tarihi: " + (urun.tarih || "");

  info.appendChild(name);
  info.appendChild(code);
  info.appendChild(price);
  info.appendChild(date);

  const favorite = document.createElement("button");
  favorite.type = "button";
  favorite.className = "product-favorite-button";
  favorite.dataset.favoriteKey = urunFavoriAnahtari(urun);
  favorite.textContent = urunFavorideMi(urun) ? "★" : "☆";
  favorite.classList.toggle("is-favorite", urunFavorideMi(urun));
  favorite.setAttribute("aria-label", urunFavorideMi(urun) ? "Favorilerden çıkar" : "Favorilere ekle");
  favorite.addEventListener("click", function(event) {
    event.stopPropagation();
    favoriDegistir(urun);
  });

  card.appendChild(img);
  card.appendChild(info);
  card.appendChild(favorite);

  card.addEventListener("click", function() {
    if (favoriPenceresinde) favoriPenceresiniKapat();
    showProductDetail(urun);
  });

  return card;
}

function sonrakiUrunleriGoster(adet) {
  const baslangic = gosterilenUrunSayisi;

  const bitis = Math.min(
    gosterilenUrunSayisi + adet,
    tumUrunler.length
  );

  for (let i = baslangic; i < bitis; i++) {
    results.appendChild(urunKartiOlustur(tumUrunler[i], false));
  }

  gosterilenUrunSayisi = bitis;

  status.textContent =
    gosterilenUrunSayisi +
    " / " +
    tumUrunler.length +
    " ürün gösteriliyor.";
}

function showProductDetail(urun) {
  seciliUrun = urun;
  const modal = document.getElementById("productModal");
  const modalImage = document.getElementById("modalImage");

  document.getElementById("modalTitle").textContent =
    urun.kod || "Ürün";

  document.getElementById("modalPrice").textContent =
    urun.fiyat || "";

  document.getElementById("modalCode").textContent =
    urun.urunKodu || "";

  document.getElementById("modalDate").textContent =
    urun.tarih || "";

  if (urun.link) {
    modalImage.src = urun.link;
    modalImage.style.display = "block";
  } else {
    modalImage.removeAttribute("src");
    modalImage.style.display = "none";
  }

  const qr = document.getElementById("qrCode");
  qr.innerHTML = "";

  if (typeof QRCode !== "undefined" && urun.urunKodu) {
    new QRCode(qr, {
      text: String(urun.urunKodu),
      width: 132,
      height: 132,
      correctLevel: QRCode.CorrectLevel.M
    });
  } else {
    qr.textContent = "QR kod oluşturulamadı.";
  }

  favoriDurumunuGuncelle();
  modal.style.display = "flex";
}

function escapeHtml(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

/*************************************************
 * BARKOD TARAYICI
 *************************************************/

let scannerInitialized = false;
let scannerOpen = false;
let scannerDetected = false;
let torchEnabled = false;

async function toggleScannerTorch() {
  try {
    if (!window.Quagga || !scannerInitialized) return;

    if (torchEnabled) {
      await Quagga.CameraAccess.disableTorch();
      torchEnabled = false;
      document.getElementById("scannerTorch").textContent = "⚡ Flaş Aç";
    } else {
      await Quagga.CameraAccess.enableTorch();
      torchEnabled = true;
      document.getElementById("scannerTorch").textContent = "⚡ Flaş Kapat";
    }

  } catch (error) {
    alert("Bu cihazda kamera flaşı desteklenmiyor.");
  }
}
  
function scannerDetectedHandler(result) {
  if (!result || !result.codeResult || scannerDetected) return;

  const barkod = result.codeResult.code;

  if (!barkod) return;

  scannerDetected = true;

  stopScanner();

  searchInput.value = barkod;
  searchProducts(true);
}

async function startScanner() {
  const scanner = document.getElementById("scanner");
  const viewport = document.getElementById("scannerViewport");

  if (!window.Quagga) {
    alert("Barkod okuyucu yüklenemedi. Sayfayı yenileyin.");
    return;
  }

  scannerOpen = true;
  scannerDetected = false;
  scannerInitialized = false;

  scanner.style.display = "block";
  viewport.innerHTML = "";

  Quagga.offDetected(scannerDetectedHandler);
  Quagga.onDetected(scannerDetectedHandler);

  Quagga.init({
    inputStream: {
      type: "LiveStream",
      target: viewport,
      constraints: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    },

    locator: {
      halfSample: true,
      patchSize: "medium"
    },

    decoder: {
      readers: [
        "ean_reader",
        "ean_8_reader",
        "upc_reader",
        "code_128_reader",
        "code_39_reader",
        "i2of5_reader"
      ]
    },

    locate: true
  }, function(err) {

    if (err) {
      console.error("Quagga kamera hatası:", err);
      alert("Kamera açılamadı. Kamera iznini kontrol edin.");
      stopScanner();
      return;
    }

    scannerInitialized = true;

    if (!scannerOpen) {
      stopScanner();
      return;
    }

    Quagga.start();
  });
}

function stopScanner() {
  scannerOpen = false;

  if (window.Quagga) {
    Quagga.offDetected(scannerDetectedHandler);
  if (torchEnabled) {
  Quagga.CameraAccess.disableTorch().catch(() => {});
  torchEnabled = false;
}
    if (scannerInitialized) {
      Quagga.stop();
    }
  }

  scannerInitialized = false;
  torchEnabled = false;
  document.getElementById("scannerTorch").textContent = "⚡ Flaş Aç";
  const scanner = document.getElementById("scanner");
  const viewport = document.getElementById("scannerViewport");

  scanner.style.display = "none";
  viewport.innerHTML = "";
}

window.addEventListener("scroll", function() {
  const scrollPosition =
    window.innerHeight + window.scrollY;

  const documentHeight =
    document.documentElement.scrollHeight;

  if (scrollPosition >= documentHeight - 300) {
    if (gosterilenUrunSayisi < tumUrunler.length) {
      sonrakiUrunleriGoster(SONRAKI_GOSTERIM);
    }
  }
});
