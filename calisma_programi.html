/* =====================================================

*{

body{

    overflow-y:auto;

    animation:acilis .15s ease-out;

    from{

.uyari-bilgi{

    color:#555;

/* =====================================================

.vardiya-listesi{

   KAPAT
===================================================== */

.uyari-kapat{

    padding:8px;

    th,

    .uyari{
        width:310px;

    .vardiya-grid{
        gap:3px;

    .vardiya-butonu{

    personeller.forEach(
        (personel,personelIndex) => {


            const tr =
                document.createElement("tr");


            /* GÖREV */

            const gorevTd =
                document.createElement("td");

            gorevTd.className =
                "personel-gorev";

            gorevTd.textContent =
                personel.gorev;

            tr.appendChild(
                gorevTd
            );


            /* ADI SOYADI */

            const isimTd =
                document.createElement("td");

            isimTd.className =
                "personel";


            const isimInput =
                document.createElement(
                    "input"
                );

            isimInput.type =
                "text";

            isimInput.className =
                "isim-input";

            isimInput.placeholder =
                "İsim";


            isimInput.value =
                personel.isim;


            isimInput.addEventListener(
                "input",
                function(){

                    personel.isim =
                        this.value;

                    programKaydet();

                }
            );


            isimTd.appendChild(
                isimInput
            );


            tr.appendChild(
                isimTd
            );


            /* 7 GÜN */

            for(
                let gunIndex = 0;
                gunIndex < 7;
                gunIndex++
            ){

                const td =
                    document.createElement("td");


                td.className =
                    "vardiya vardiya-bos";


                td.dataset.personel =
                    personelIndex;


                td.dataset.gun =
                    gunIndex;


                td.textContent =
                    "—";


                td.addEventListener(
                    "click",
                    function(){

                        pencereAc(
                            td,
                            personel,
                            gunIndex
                        );

                    }
                );


                tr.appendChild(
                    td
                );

            }


            /* HAFTALIK TOPLAM */

            const toplamTd =
                document.createElement("td");


            toplamTd.className =
                "saat-toplam";


            toplamTd.id =
                "toplam-" +
                personelIndex;


            toplamTd.textContent =
                "0";


            tr.appendChild(
                toplamTd
            );


            body.appendChild(
                tr
            );

        }
    );


    tarihleriOlustur();

}


/* =====================================================
   TARİHLER
===================================================== */

function tarihleriOlustur(){

    const input =
        document.getElementById(
            "baslangicTarihi"
        );


    let baslangic =
        input.value;


    if(!baslangic){

        const bugun =
            new Date();


        const gun =
            String(
                bugun.getDate()
            ).padStart(
                2,
                "0"
            );


        const ay =
            String(
                bugun.getMonth()+1
            ).padStart(
                2,
                "0"
            );


        const yil =
            bugun.getFullYear();


        baslangic =
            yil +
            "-" +
            ay +
            "-" +
            gun;


        input.value =
            baslangic;

    }


    const tarih =
        new Date(
            baslangic +
            "T00:00:00"
        );


    const thler =
        document.querySelectorAll(
            "thead tr:nth-child(2) th"
        );


    for(
        let i = 0;
        i < 7;
        i++
    ){

        const yeniTarih =
            new Date(
                tarih
            );


        yeniTarih.setDate(
            tarih.getDate() +
            i
        );


        thler[i].textContent =
            yeniTarih.toLocaleDateString(
                "tr-TR",
                {
                    day:"2-digit",
                    month:"2-digit"
                }
            );

    }

}

/* =====================================================
   VARDİYA SEÇ
===================================================== */

function vardiyaSec(
    vardiya
){

    if(!seciliHucre){
        return;
    }


    /*
       Önce durum sınıflarını temizle
    */

    seciliHucre.classList.remove(
        "durum-b",
        "durum-y",
        "durum-r",
        "vardiya-bos"
    );


    seciliHucre.classList.add(
        "vardiya-secili"
    );


    /*
       Hücreye saatleri yaz
    */

    seciliHucre.innerHTML =

        '<span class="saat-yazi">' +

        vardiya.baslangic +

        "<br>" +

        vardiya.bitis +

        "</span>";


    /*
       Hesaplama için süre
    */

    seciliHucre.dataset.sure =
        vardiya.sure;


    seciliHucre.dataset.tip =
        "vardiya";


    toplamHesapla();

    programKaydet();

    pencereKapat();

}


/* =====================================================
   B / Y / R SEÇ
===================================================== */

function durumSec(
    durum
){

    if(!seciliHucre){
        return;
    }


    seciliHucre.classList.remove(
        "vardiya-bos",
        "vardiya-secili",
        "durum-b",
        "durum-y",
        "durum-r"
    );


    seciliHucre.dataset.sure =
        "0";


    seciliHucre.dataset.tip =
        durum;


    if(durum === "B"){

        seciliHucre.classList.add(
            "durum-b"
        );

        seciliHucre.textContent =
            "B";

    }


    if(durum === "Y"){

        seciliHucre.classList.add(
            "durum-y"
        );

        seciliHucre.textContent =
            "Y";

    }


    if(durum === "R"){

        seciliHucre.classList.add(
            "durum-r"
        );

        seciliHucre.textContent =
            "R";

    }


    toplamHesapla();

    programKaydet();

    pencereKapat();

}


/* =====================================================
   VARDİYA TEMİZLE
===================================================== */

function vardiyaTemizle(){

    if(!seciliHucre){

        pencereKapat();

        return;

    }


    seciliHucre.classList.remove(
        "vardiya-secili",
        "durum-b",
        "durum-y",
        "durum-r"
    );


    seciliHucre.classList.add(
        "vardiya-bos"
    );


    seciliHucre.textContent =
        "—";


    seciliHucre.dataset.sure =
        "";


    seciliHucre.dataset.tip =
        "";


    toplamHesapla();

    programKaydet();

    pencereKapat();

}


/* =====================================================
   TOPLAM SAAT
===================================================== */

function toplamHesapla(){

    const satirlar =
        document.querySelectorAll(
            "#programBody tr"
        );


    satirlar.forEach(
        (tr,personelIndex) => {


            let toplam = 0;


            const hucreler =
                tr.querySelectorAll(
                    ".vardiya"
                );


            hucreler.forEach(
                hucre => {


                    const sure =
                        Number(
                            hucre.dataset.sure
                        ) || 0;


                    toplam +=
                        sure;

                }
            );


            document.getElementById(
                "toplam-" +
                personelIndex
            ).textContent =

                toplam.toLocaleString(
                    "tr-TR",
                    {
                        minimumFractionDigits:0,
                        maximumFractionDigits:1
                    }
                );

        }
    );

}


/* =====================================================
   PENCERE KAPAT
===================================================== */

function pencereKapat(){

    document
        .getElementById(
            "uyariOverlay"
        )
        .classList.remove(
            "acik"
        );

}


/* =====================================================
   DIŞARI TIKLAYINCA KAPAT
===================================================== */

document
    .getElementById(
        "uyariOverlay"
    )
    .addEventListener(
        "click",
        function(e){

            if(
                e.target === this
            ){

                pencereKapat();

            }

        }
    );


/* =====================================================
   PROGRAM VERİSİNİ HAFIZAYA KAYDET
===================================================== */

function programKaydet(){

    if(!aktifHafta){
        return;
    }


    const veri = {

        personeller:
            personeller.map(
                personel => ({
                    gorev:
                        personel.gorev,

                    isim:
                        personel.isim
                })
            ),

        hucreler:[]

    };


    document
        .querySelectorAll(
            ".vardiya"
        )
        .forEach(
            hucre => {

                veri.hucreler.push({

                    personel:
                        Number(
                            hucre.dataset.personel
                        ),

                    gun:
                        Number(
                            hucre.dataset.gun
                        ),

                    sure:
                        hucre.dataset.sure || "",

                    tip:
                        hucre.dataset.tip || "",

                    text:
                        hucre.innerText

                });

            }
        );


    try{

        const mevcut =
            JSON.parse(
                localStorage.getItem(
                    HAFIZA_ANAHTARI
                ) || "{}"
            );


        mevcut[aktifHafta] =
            veri;


        localStorage.setItem(
            HAFIZA_ANAHTARI,
            JSON.stringify(
                mevcut
            )
        );

        localStorage.setItem(
            SON_DUZENLENEN_HAFTA_ANAHTARI,
            aktifHafta
        );

    }
    catch(hata){

        console.error(
            "Hafıza kayıt hatası:",
            hata
        );

    }

}


/* =====================================================
   PROGRAMI HAFIZADAN YÜKLE
===================================================== */

function programYukle(){

    if(!aktifHafta){
        return;
    }


    try{

        const mevcut =
            JSON.parse(
                localStorage.getItem(
                    HAFIZA_ANAHTARI
                ) || "{}"
            );


        const veri =
            mevcut[aktifHafta];


        if(!veri){
            toplamHesapla();
            return;
        }


        /*
           Hücreleri yükle
        */

        if(veri.hucreler){

            veri.hucreler.forEach(
                kayit => {


                    const hucre =
                        document.querySelector(
                            '.vardiya[data-personel="' +
                            kayit.personel +
                            '"][data-gun="' +
                            kayit.gun +
                            '"]'
                        );


                    if(!hucre){
                        return;
                    }


                    hucre.dataset.sure =
                        kayit.sure || "";


                    hucre.dataset.tip =
                        kayit.tip || "";


                    hucre.classList.remove(
                        "vardiya-bos",
                        "vardiya-secili",
                        "durum-b",
                        "durum-y",
                        "durum-r"
                    );


                    if(
                        kayit.tip ===
                        "B"
                    ){

                        hucre.classList.add(
                            "durum-b"
                        );

                        hucre.textContent =
                            "B";

                    }
                    else if(
                        kayit.tip ===
                        "Y"
                    ){

                        hucre.classList.add(
                            "durum-y"
                        );

                        hucre.textContent =
                            "Y";

                    }
                    else if(
                        kayit.tip ===
                        "R"
                    ){

                        hucre.classList.add(
                            "durum-r"
                        );

                        hucre.textContent =
                            "R";

                    }
                    else if(
                        kayit.sure !== ""
                    ){

                        hucre.classList.add(
                            "vardiya-secili"
                        );

                        hucre.innerHTML =
                            '<span class="saat-yazi">' +
                            kayit.text.replace(
                                /\n/g,
                                "<br>"
                            ) +
                            "</span>";

                    }
                    else{

                        hucre.classList.add(
                            "vardiya-bos"
                        );

                        hucre.textContent =
                            "—";

                    }

                }
            );

        }


        toplamHesapla();

    }
    catch(hata){

        console.error(
            "Hafıza yükleme hatası:",
            hata
        );

    }

}


/* =====================================================
   TARİH DEĞİŞİNCE
===================================================== */

document
    .getElementById(
        "baslangicTarihi"
    )
    .addEventListener(
        "change",
        function(){

            /*
               Eski haftayı kaydet
            */

            programKaydet();


            /*
               Yeni haftaya geç
            */

            aktifHafta =
                this.value;


            /*
               Tabloyu temizle
            */

            document
                .querySelectorAll(
                    ".vardiya"
                )
                .forEach(
                    hucre => {

                        hucre.classList.remove(
                            "vardiya-secili",
                            "durum-b",
                            "durum-y",
                            "durum-r"
                        );


                        hucre.classList.add(
                            "vardiya-bos"
                        );


                        hucre.textContent =
                            "—";


                        hucre.dataset.sure =
                            "";


                        hucre.dataset.tip =
                            "";

                    }
                );


            /*
               Yeni haftanın kayıtlarını yükle
            */

            programYukle();


            /*
               Tarihleri yenile
            */

            tarihleriOlustur();

        }
    );


/* =====================================================
   TABLOYU RESİM OLARAK PAYLAŞ
===================================================== */

let html2canvasYukleniyor = null;

function html2canvasYukle(){

    if(typeof html2canvas === "function"){
        return Promise.resolve();
    }

    if(html2canvasYukleniyor){
        return html2canvasYukleniyor;
    }

    html2canvasYukleniyor = new Promise(function(resolve,reject){

        const script = document.createElement("script");
        script.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
        script.async = true;

        script.onload = function(){ resolve(); };
        script.onerror = function(){
            html2canvasYukleniyor = null;
            reject(new Error("html2canvas yüklenemedi"));
        };

        document.head.appendChild(script);
    });

    return html2canvasYukleniyor;
}


let tabloResimBlob = null;
let tabloResimUrl = null;

async function tabloyuResimOlarakPaylas(){

    programKaydet();

    const tablo = document.getElementById("programTablosu");
    const buton = document.querySelector(".resim-paylas");

    if(!tablo){
        alert("Tablo bulunamadı.");
        return;
    }

    const eskiYazi = buton.textContent;
    buton.textContent = "RESİM HAZIRLANIYOR...";
    buton.disabled = true;

    try{
        // Kütüphane yalnızca kullanıcı paylaşım düğmesine bastığında yüklenir.
        await html2canvasYukle();

        // Form alanlarının güncel değerlerini resme doğru aktar.
        tablo.querySelectorAll(".isim-input").forEach(input => {
            input.setAttribute("value", input.value);
        });

        const canvas = await html2canvas(tablo, {
            backgroundColor: "#ffffff",
            scale: 3,
            useCORS: true,
            logging: false,
            allowTaint: false
        });

        const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
        if(!blob){
            throw new Error("Tablo resmi oluşturulamadı.");
        }

        // Önceki önizleme varsa eski URL'yi serbest bırak.
        if(tabloResimUrl){
            URL.revokeObjectURL(tabloResimUrl);
        }
        tabloResimBlob = blob;
        tabloResimUrl = URL.createObjectURL(blob);

        document.getElementById("olusturulanTabloResmi").src = tabloResimUrl;
        document.getElementById("resimOnizlemeOverlay").classList.add("acik");

    }
    catch(hata){
        console.error("Tablo resmi oluşturma hatası:", hata);
        alert("Tablo resmi oluşturulamadı. İnternet bağlantınızı kontrol edip tekrar deneyin.");
    }
    finally{
        buton.textContent = eskiYazi;
        buton.disabled = false;
    }
}

function tabloResminiIndir(){
    if(!tabloResimBlob || !tabloResimUrl){
        alert("İndirilecek resim bulunamadı.");
        return;
    }

    const link = document.createElement("a");
    link.href = tabloResimUrl;
    link.download = "haftalik-calisma-programi.png";
    link.style.display = "none";
    document.body.appendChild(link);
    link.click();
    link.remove();
}

async function tabloResminiPaylasmayiDene(){
    if(!tabloResimBlob){
        alert("Paylaşılacak resim bulunamadı.");
        return;
    }

    try{
        const dosya = new File([tabloResimBlob], "haftalik-calisma-programi.png", {type:"image/png"});
        if(navigator.share && (!navigator.canShare || navigator.canShare({files:[dosya]}))){
            await navigator.share({title:"Haftalık Çalışma Programı", files:[dosya]});
        }else{
            alert("Bu Telegram/WebView ekranında doğrudan paylaşım desteklenmiyor.");
        }
    }
    catch(hata){
        if(hata.name !== "AbortError"){
            console.error("Resim paylaşma hatası:", hata);
            alert("Paylaşım açılamadı. Resmi indirme seçeneğini deneyebilirsiniz.");
        }
    }
}

function resimOnizlemeKapat(){
    document.getElementById("resimOnizlemeOverlay").classList.remove("acik");
}

document.getElementById("resimOnizlemeOverlay").addEventListener("click", function(e){
    if(e.target === this){
        resimOnizlemeKapat();
    }
});

/* =====================================================
   BAŞLAT
===================================================== */

/*
   İlk ekranın çizilmesine izin ver.
   Android/WebView tarafında tüm tablo oluşturma ve
   hafıza işlemlerini HTML parse işleminin önüne koyma.
*/
function programiBaslat(){

    tabloOlustur();

    const tarihInput =
        document.getElementById("baslangicTarihi");

    let sonHafta = "";

    try{
        sonHafta =
            localStorage.getItem(
                SON_DUZENLENEN_HAFTA_ANAHTARI
            ) || "";
    }
    catch(hata){
        console.error("Son hafta okunamadı:", hata);
    }

    if(sonHafta){
        tarihInput.value = sonHafta;
    }
    else if(!tarihInput.value){
        const bugun = new Date();
        tarihInput.value =
            bugun.getFullYear() + "-" +
            String(bugun.getMonth() + 1).padStart(2, "0") + "-" +
            String(bugun.getDate()).padStart(2, "0");
    }

    aktifHafta = tarihInput.value;

    programYukle();

    tarihleriOlustur();
    toplamHesapla();
}

if("requestAnimationFrame" in window){
    requestAnimationFrame(function(){
        setTimeout(programiBaslat, 0);
    });
}
else{
    setTimeout(programiBaslat, 0);
}
