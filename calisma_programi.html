<style>

/* =====================================================
   GENEL
===================================================== */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:6px;
    font-family:Arial,Helvetica,sans-serif;
    background:#eeeeee;
    color:#111;
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    background:#fff;
    padding:7px;
    border-radius:7px;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
}

.baslik{
    text-align:center;
    font-size:18px;
    font-weight:bold;
    margin-bottom:7px;
}


/* =====================================================
   TARİH
===================================================== */

.tarih-alani{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    margin-bottom:6px;
    font-size:12px;
    font-weight:bold;
}

.tarih-alani input{
    height:25px;
    border:1px solid #999;
    border-radius:4px;
    padding:2px 6px;
}


/* =====================================================
   TABLO
===================================================== */

.tablo-wrapper{
    width:100%;
    overflow-x:auto;
}

table{
    border-collapse:collapse;
    width:auto;
    margin:auto;
    table-layout:fixed;
}

th,
td{
    border:1px solid #777;
    text-align:center;
    vertical-align:middle;
    padding:2px;
    font-size:10px;
}


/* =====================================================
   BAŞLIK
===================================================== */

.baslik-gri{
    background:#eeeeee;
}


/* =====================================================
   GÖREV
===================================================== */

.gorev{
    width:43px;
    min-width:43px;
    max-width:43px;
    height:24px;
}


/* =====================================================
   ADI SOYADI
===================================================== */

.ad{
    width:78px;
    min-width:78px;
    max-width:78px;
    height:24px;
}

.isim-input{
    width:100%;
    height:22px;
    border:0;
    outline:none;
    background:#fff;
    padding:2px 4px;
    text-align:left;
    font-size:10px;
}


/* =====================================================
   GÜNLER
===================================================== */

.gun{
    width:57px;
    min-width:57px;
    max-width:57px;
}

.tarih{
    width:57px;
    min-width:57px;
    max-width:57px;
}


/* =====================================================
   HAFTALIK TOPLAM
===================================================== */

.toplam{
    width:65px;
    min-width:65px;
    max-width:65px;
}


/* =====================================================
   ÜST SATIR
===================================================== */

thead tr:first-child th{
    height:22px;
    line-height:14px;
    font-weight:bold;
    padding:2px;
}


/* =====================================================
   TARİH SATIRI
===================================================== */

thead tr:nth-child(2) th{
    height:20px;
    line-height:14px;
    font-weight:bold;
    padding:2px;
}


/* =====================================================
   PERSONEL GÖREV
===================================================== */

.personel-gorev{
    background:#f5f5f5;
    font-weight:bold;
    height:30px;
}


/* =====================================================
   VARDİYA HÜCRELERİ
===================================================== */

.vardiya{
    width:57px;
    min-width:57px;
    max-width:57px;

    height:30px;
    min-height:30px;

    cursor:pointer;

    background:#fffde8;

    transition:.15s;

    white-space:normal;
}

.vardiya:hover{
    background:#fff4b8;
}

.vardiya-secili{
    background:#ffffff !important;
    font-weight:bold;
}

.vardiya-bos{
    color:#999;
}


/* =====================================================
   TABLO İÇİNDEKİ SAATLER
===================================================== */

.saat-yazi{
    display:block;
    font-size:9px;
    line-height:11px;
    white-space:normal;
}


/* =====================================================
   İZİN / RAPOR DURUMLARI
===================================================== */

.durum-b{
    background:#d9ead3 !important;
    color:#38761d !important;
    font-weight:bold;
}

.durum-y{
    background:#cfe2f3 !important;
    color:#1155cc !important;
    font-weight:bold;
}

.durum-r{
    background:#f4cccc !important;
    color:#cc0000 !important;
    font-weight:bold;
}


/* =====================================================
   TOPLAM SAAT
===================================================== */

.saat-toplam{
    background:#e2efda;
    font-weight:bold;
    font-size:10px;

/* =====================================================
   RESİM OLARAK PAYLAŞ
===================================================== */

.resim-paylas-alani{

.resim-paylas{

/* =====================================================
   UYARI PENCERESİ
===================================================== */

.uyari-overlay{

    position:fixed;

    display:none;

    align-items:center;

    justify-content:center;

    z-index:9999;
}

.uyari-overlay.acik{
    display:flex;
}

@media(min-width:701px){
    .uyari-overlay{
        align-items:flex-start;
    }

.uyari{

    width:310px;

    max-width:94%;

    max-height:94vh;

    background:#fff;

    border-radius:9px;

    box-shadow:0 8px 30px rgba(0,0,0,.30);

    overflow-y:auto;

    animation:acilis .15s ease-out;
}


@keyframes acilis{

    from{
        transform:scale(.92);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }

}


/* =====================================================
   UYARI BAŞLIĞI
===================================================== */

    background:#eeeeee;

.uyari-bilgi{

    color:#555;

/* =====================================================
   VARDİYA LİSTESİ
===================================================== */

.vardiya-listesi{

/* =====================================================

.vardiya-bolum{

.vardiya-bolum-baslik{

    font-weight:bold;

    color:#555;

    margin-bottom:3px;

   4 SÜTUNLU VARDİYA SATIRI
===================================================== */

.vardiya-grid{

    width:100%;

   VARDİYA KUTUSU
===================================================== */

.vardiya-butonu{

    line-height:11px;

.vardiya-butonu:hover{

/* =====================================================

.vardiya-diger-uzun{

/* =====================================================
   SAATLER
===================================================== */

.vardiya-saat{

    display:block;

    font-size:10px;

    line-height:11px;

}


/* =====================================================
   SÜRE
   KULLANICIYA GÖSTERİLMEZ
===================================================== */

.vardiya-sure{

    display:none;

}


/* =====================================================
   B - Y - R BUTONLARI
===================================================== */

.durum-listesi{

    display:grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap:5px;

    padding:2px 7px 8px;

}


.durum-butonu{

    border:1px solid #aaa;

    border-radius:5px;

    padding:7px 3px;

    background:#f5f5f5;

    cursor:pointer;

    font-size:9px;

    font-weight:bold;

    line-height:11px;

    min-height:35px;

}

.durum-butonu:hover{
    opacity:.85;
}


.durum-b-butonu{
    background:#d9ead3;
}

.durum-y-butonu{
    background:#cfe2f3;
}

.durum-r-butonu{
    background:#f4cccc;
}


/* =====================================================
   TEMİZLE
===================================================== */

.temizle-alani{

    padding:0 9px 8px;

    text-align:center;

}

.vardiya-temizle{

    width:210px;

    max-width:100%;

    border:0;

    background:#f4cccc;

    border-radius:5px;

    padding:7px;

    cursor:pointer;

    font-size:10px;

    font-weight:bold;

/* =====================================================
   KAPAT
===================================================== */

.uyari-kapat{

    width:100%;

    border:0;

    border-top:1px solid #ddd;

    background:#f7f7f7;

    padding:8px;

    cursor:pointer;

    font-weight:bold;

    font-size:12px;

/* =====================================================

===================================================== */

.aciklama{

    margin-top:7px;

    background:#f7f7f7;

    border:1px solid #ddd;

    border-radius:5px;

    font-size:10px;

    line-height:1.4;

/* =====================================================

/* =====================================================
   TABLO OLUŞTUR
===================================================== */

function tabloOlustur(){

    const body =
        document.getElementById(
            "programBody"
        );

    body.innerHTML = "";


    personeller.forEach(
        (personel,personelIndex) => {


            const tr =
                document.createElement("tr");


            /* GÖREV */

            const gorevTd =
                document.createElement("td");

            gorevTd.className =
                "personel-gorev";

            gorevTd.textContent =
                personel.gorev;

            tr.appendChild(
                gorevTd
            );


            /* ADI SOYADI */

            const isimTd =
                document.createElement("td");

            isimTd.className =
                "personel";


            const isimInput =
                document.createElement(
                    "input"
                );

            isimInput.type =
                "text";

            isimInput.className =
                "isim-input";

            isimInput.placeholder =
                "İsim";


            isimInput.value =
                personel.isim;


            isimInput.addEventListener(
                "input",
                function(){

                    personel.isim =
                        this.value;

                    isimleriKaydet();
                    programKaydet();

                }
            );


            isimTd.appendChild(
                isimInput
            );


            tr.appendChild(
                isimTd
            );


            /* 7 GÜN */

            for(
                let gunIndex = 0;
                gunIndex < 7;
                gunIndex++
            ){

                const td =
                    document.createElement("td");


                td.className =
                    "vardiya vardiya-bos";


                td.dataset.personel =
                    personelIndex;


                td.dataset.gun =
                    gunIndex;


                td.textContent =
                    "—";


                td.addEventListener(
                    "click",
                    function(){

                        pencereAc(
                            td,
                            personel,
                            gunIndex
                        );

                    }
                );


                tr.appendChild(
                    td
                );

            }


            /* HAFTALIK TOPLAM */

            const toplamTd =
                document.createElement("td");


            toplamTd.className =
                "saat-toplam";


            toplamTd.id =
                "toplam-" +
                personelIndex;


            toplamTd.textContent =
                "0";


            tr.appendChild(
                toplamTd
            );


            body.appendChild(
                tr
            );

        }
    );


    tarihleriOlustur();

}


/* =====================================================
   TARİHLER
===================================================== */

function tarihleriOlustur(){

    const input =
        document.getElementById(
            "baslangicTarihi"
        );


    let baslangic =
        input.value;


    if(!baslangic){

        const bugun =
            new Date();


        const gun =
            String(
                bugun.getDate()
            ).padStart(
                2,
                "0"
            );


        const ay =
            String(
                bugun.getMonth()+1
            ).padStart(
                2,
                "0"
            );


        const yil =
            bugun.getFullYear();


        baslangic =
            yil +
            "-" +
            ay +
            "-" +
            gun;


        input.value =
            baslangic;

    }


    const tarih =
        new Date(
            baslangic +
            "T00:00:00"
        );


    const thler =
        document.querySelectorAll(
            "thead tr:nth-child(2) th"
        );


    for(
        let i = 0;
        i < 7;
        i++
    ){

        const yeniTarih =
            new Date(
                tarih
            );


        yeniTarih.setDate(
            tarih.getDate() +
            i
        );


        thler[i].textContent =
            yeniTarih.toLocaleDateString(
                "tr-TR",
                {
                    day:"2-digit",
                    month:"2-digit"
                }
            );

    }

}

/* =====================================================
   VARDİYA PENCERESİ
===================================================== */

function masaustuUyariKonumu(){

    const overlay =
        document.getElementById("uyariOverlay");

    const uyari =
        overlay.querySelector(".uyari");

    if(window.innerWidth <= 700){
        uyari.style.marginTop = "0px";
        return;
    }

    const buton =
        document.querySelector(".resim-paylas");

    if(!buton){
        return;
    }

    const rect = buton.getBoundingClientRect();

    let ust = rect.top;

    const yukseklik = uyari.offsetHeight;

    if(ust + yukseklik > window.innerHeight - 8){
        ust = window.innerHeight - yukseklik - 8;
    }

    if(ust < 8){
        ust = 8;
    }

    uyari.style.marginTop = ust + "px";

}

/* =====================================================
   VARDİYA SEÇ
===================================================== */

function vardiyaSec(
    vardiya
){

    if(!seciliHucre){
        return;
    }


    /*
       Önce durum sınıflarını temizle
    */

    seciliHucre.classList.remove(
        "durum-b",
        "durum-y",
        "durum-r",
        "vardiya-bos"
    );


    seciliHucre.classList.add(
        "vardiya-secili"
    );


    /*
       Hücreye saatleri yaz
    */

    seciliHucre.innerHTML =

        '<span class="saat-yazi' +
        (vardiya.digerUzun ? ' diger-uzun-secili' : '') +
        '">' +

        vardiya.baslangic +

        "<br>" +

        vardiya.bitis +

        "</span>";


    /*
       Hesaplama için süre
    */

    seciliHucre.dataset.sure =
        vardiya.sure;


    seciliHucre.dataset.tip =
        "vardiya";


    toplamHesapla();

    programKaydet();

    pencereKapat();

}


/* =====================================================
   B / Y / R SEÇ
===================================================== */

function durumSec(
    durum
){

    if(!seciliHucre){
        return;
    }


    seciliHucre.classList.remove(
        "vardiya-bos",
        "vardiya-secili",
        "durum-b",
        "durum-y",
        "durum-r"
    );


    seciliHucre.dataset.sure =
        "0";


    seciliHucre.dataset.tip =
        durum;


    if(durum === "B"){

        seciliHucre.classList.add(
            "durum-b"
        );

        seciliHucre.textContent =
            "B";

    }


    if(durum === "Y"){

        seciliHucre.classList.add(
            "durum-y"
        );

        seciliHucre.textContent =
            "Y";

    }


    if(durum === "R"){

        seciliHucre.classList.add(
            "durum-r"
        );

        seciliHucre.textContent =
            "R";

    }


    toplamHesapla();

    programKaydet();

    pencereKapat();

}


/* =====================================================
   VARDİYA TEMİZLE
===================================================== */

function vardiyaTemizle(){

    if(!seciliHucre){

        pencereKapat();

        return;

    }


    seciliHucre.classList.remove(
        "vardiya-secili",
        "durum-b",
        "durum-y",
        "durum-r"
    );


    seciliHucre.classList.add(
        "vardiya-bos"
    );


    seciliHucre.textContent =
        "—";


    seciliHucre.dataset.sure =
        "";


    seciliHucre.dataset.tip =
        "";


    toplamHesapla();

    programKaydet();

    pencereKapat();

}


/* =====================================================
   TOPLAM SAAT
===================================================== */

function toplamHesapla(){

    const satirlar =
        document.querySelectorAll(
            "#programBody tr"
        );


    satirlar.forEach(
        (tr,personelIndex) => {


            let toplam = 0;


            const hucreler =
                tr.querySelectorAll(
                    ".vardiya"
                );


            hucreler.forEach(
                hucre => {


                    const sure =
                        Number(
                            hucre.dataset.sure
                        ) || 0;


                    toplam +=
                        sure;

                }
            );


            document.getElementById(
                "toplam-" +
                personelIndex
            ).textContent =

                toplam.toLocaleString(
                    "tr-TR",
                    {
                        minimumFractionDigits:0,
                        maximumFractionDigits:1
                    }
                );

        }
    );

}

   PENCERE KAPAT

/* =====================================================
   PROGRAM VERİSİNİ HAFIZAYA KAYDET
===================================================== */

function isimleriKaydet(){

    try{

        localStorage.setItem(
            ISIM_HAFIZA_ANAHTARI,
            JSON.stringify(
                personeller.map(
                    personel => personel.isim || ""
                )
            )
        );

    }
    catch(hata){
        console.error("İsim hafıza kayıt hatası:", hata);
    }

}


function isimleriYukle(){

    try{

        const kayit =
            localStorage.getItem(ISIM_HAFIZA_ANAHTARI);

        if(!kayit){
            return;
        }

        const isimler = JSON.parse(kayit);

        if(!Array.isArray(isimler)){
            return;
        }

        isimler.forEach((isim,index) => {

            if(personeller[index]){
                personeller[index].isim = isim || "";
            }

        });

        document
            .querySelectorAll(".isim-input")
            .forEach((input,index) => {

                if(personeller[index]){
                    input.value = personeller[index].isim;
                }

            });

    }
    catch(hata){
        console.error("İsim hafıza yükleme hatası:", hata);
    }

}


function programKaydet(){

    if(!aktifHafta){
        return;
    }


    const veri = {

        personeller:
            personeller.map(
                personel => ({
                    gorev:
                        personel.gorev,

                    isim:
                        personel.isim
                })
            ),

        hucreler:[]

    };


    document
        .querySelectorAll(
            ".vardiya"
        )
        .forEach(
            hucre => {

                veri.hucreler.push({

                    personel:
                        Number(
                            hucre.dataset.personel
                        ),

                    gun:
                        Number(
                            hucre.dataset.gun
                        ),

                    sure:
                        hucre.dataset.sure || "",

                    tip:
                        hucre.dataset.tip || "",

                    text:
                        hucre.innerText

                });

            }
        );


    try{

        const mevcut =
            JSON.parse(
                localStorage.getItem(
                    HAFIZA_ANAHTARI
                ) || "{}"
            );


        mevcut[aktifHafta] =
            veri;


        localStorage.setItem(
            HAFIZA_ANAHTARI,
            JSON.stringify(
                mevcut
            )
        );

    }
    catch(hata){

        console.error(
            "Hafıza kayıt hatası:",
            hata
        );

    }

}


/* =====================================================
   PROGRAMI HAFIZADAN YÜKLE
===================================================== */

function programYukle(){

    if(!aktifHafta){
        return;
    }


    try{

        const mevcut =
            JSON.parse(
                localStorage.getItem(
                    HAFIZA_ANAHTARI
                ) || "{}"
            );


        const veri =
            mevcut[aktifHafta];


        if(!veri){
            toplamHesapla();
            return;
        }


        /* İsimler haftadan bağımsız hafızadan yüklenir. */


        /*
           Hücreleri yükle
        */

        if(veri.hucreler){

            veri.hucreler.forEach(
                kayit => {


                    const hucre =
                        document.querySelector(
                            '.vardiya[data-personel="' +
                            kayit.personel +
                            '"][data-gun="' +
                            kayit.gun +
                            '"]'
                        );


                    if(!hucre){
                        return;
                    }


                    hucre.dataset.sure =
                        kayit.sure || "";


                    hucre.dataset.tip =
                        kayit.tip || "";


                    hucre.classList.remove(
                        "vardiya-bos",
                        "vardiya-secili",
                        "durum-b",
                        "durum-y",
                        "durum-r"
                    );


                    if(
                        kayit.tip ===
                        "B"
                    ){

                        hucre.classList.add(
                            "durum-b"
                        );

                        hucre.textContent =
                            "B";

                    }
                    else if(
                        kayit.tip ===
                        "Y"
                    ){

                        hucre.classList.add(
                            "durum-y"
                        );

                        hucre.textContent =
                            "Y";

                    }
                    else if(
                        kayit.tip ===
                        "R"
                    ){

                        hucre.classList.add(
                            "durum-r"
                        );

                        hucre.textContent =
                            "R";

                    }
                    else if(
                        kayit.sure !== ""
                    ){

                        hucre.classList.add(
                            "vardiya-secili"
                        );

                        const uzunSinif =
                            kayit.text &&
                            kayit.text.includes("-")
                                ? " diger-uzun-secili"
                                : "";

                        hucre.innerHTML =
                            '<span class="saat-yazi' +
                            uzunSinif +
                            '">' +
                            kayit.text.replace(
                                /\n/g,
                                "<br>"
                            ) +
                            "</span>";

                    }
                    else{

                        hucre.classList.add(
                            "vardiya-bos"
                        );

                        hucre.textContent =
                            "—";

                    }

                }
            );

        }


        toplamHesapla();

    }
    catch(hata){

        console.error(
            "Hafıza yükleme hatası:",
            hata
        );

    }

}


window.addEventListener("resize", function(){

    const overlay =

document

                        hucre.textContent =

                        hucre.dataset.sure =

            */

    );


/* =====================================================
   TABLOYU RESİM OLARAK PAYLAŞ
===================================================== */

async function tabloyuResimOlarakPaylas(){

    /*
       Önce son değişiklikleri kaydet
    */

    programKaydet();


    const tablo =
        document.getElementById(
            "programTablosu"
        );


    if(!tablo){

        alert(
            "Tablo bulunamadı."
        );

        return;

    }


    if(
        typeof html2canvas ===
        "undefined"
    ){

        alert(
            "Resim oluşturma özelliği yüklenemedi. İnternet bağlantınızı kontrol edin."
        );

        return;

    }


    const buton =
        document.querySelector(
            ".resim-paylas"
        );


    const eskiYazi =
        buton.textContent;


    buton.textContent =
        "RESİM HAZIRLANIYOR...";


    buton.disabled =
        true;


    try{


        /*
           Input değerlerini görüntü için
           value özelliğine aktar
        */

        const inputlar =
            tablo.querySelectorAll(
                ".isim-input"
            );


        inputlar.forEach(
            input => {

                input.setAttribute(
                    "value",
                    input.value
                );

            }
        );


        const canvas =
            await html2canvas(
                tablo,
                {

                    backgroundColor:
                        "#ffffff",

                    scale:3,

                    useCORS:true,

                    logging:false,

                    allowTaint:false

                }
            );


        canvas.toBlob(
            async function(blob){

                if(!blob){

                    alert(
                        "Tablo resmi oluşturulamadı."
                    );

                    buton.textContent =
                        eskiYazi;

                    buton.disabled =
                        false;

                    return;

                }


                const dosya =
                    new File(
                        [
                            blob
                        ],
                        "haftalik-calisma-programi.png",
                        {
                            type:
                                "image/png"
                        }
                    );


                if(
                    navigator.share &&
                    navigator.canShare &&
                    navigator.canShare(
                        {
                            files:[
                                dosya
                            ]
                        }
                    )
                ){

                    try{

                        await navigator.share({

                            title:
                                "Haftalık Çalışma Programı",

                            files:[
                                dosya
                            ]

                        });

                    }
                    catch(hata){

                        if(
                            hata.name !==
                            "AbortError"
                        ){

                            pngIndir(
                                blob
                            );

                        }

                    }

                }
                else{

                    pngIndir(
                        blob
                    );

                }


                buton.textContent =
                    eskiYazi;


                buton.disabled =
                    false;

            },
            "image/png"
        );


    }
    catch(hata){

        console.error(
            "Resim oluşturma hatası:",
            hata
        );


        alert(
            "Tablo resmi oluşturulamadı."
        );


        buton.textContent =
            eskiYazi;


        buton.disabled =
            false;

    }

}


/* =====================================================
   PNG İNDİR
===================================================== */

function pngIndir(
    blob
){

    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        "haftalik-calisma-programi.png";


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );


    setTimeout(
        function(){

            URL.revokeObjectURL(
                url
            );

        },
        1000
    );

}


/* =====================================================
   BAŞLAT
===================================================== */

tabloOlustur();


/*
   İsimleri tarihten bağımsız hafızadan yükle
*/

isimleriYukle();


/*
   Başlangıç haftasını belirle
*/

aktifHafta =
    document.getElementById(
        "baslangicTarihi"
    ).value;


/*
   Kayıtlı programı yükle
*/

programYukle();


/*
   Toplamları hesapla
*/

toplamHesapla();

</script>
