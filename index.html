<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>KısaKod</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f5f5;
    color: #222;
}

.header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: #ffffff;
    padding: 14px 14px 10px;
    border-bottom: 1px solid #e5e5e5;
}

.title {
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 12px;
}

.search-row {
    display: flex;
    gap: 8px;
}

.search-box {
    flex: 1;
    height: 48px;
    border: 1px solid #d5d5d5;
    border-radius: 12px;
    padding: 0 14px;
    font-size: 16px;
    outline: none;
    background: #fff;
}

.search-box:focus {
    border-color: #999;
}

.camera-btn {
    width: 48px;
    height: 48px;
    border: 0;
    border-radius: 12px;
    background: #222;
    color: #fff;
    font-size: 22px;
    cursor: pointer;
}

.status {
    padding: 14px;
    color: #777;
    text-align: center;
    font-size: 14px;
}

.cards {
    padding: 10px;
}

.card {
    background: #fff;
    border-radius: 14px;
    margin-bottom: 10px;
    padding: 12px;
    display: flex;
    gap: 12px;
    align-items: center;
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    transition: transform 0.08s ease;
}

.card:active {
    transform: scale(0.98);
}

.card-image {
    width: 76px;
    height: 76px;
    border-radius: 10px;
    object-fit: contain;
    background: #f7f7f7;
    flex-shrink: 0;
}

.card-info {
    min-width: 0;
    flex: 1;
}

.card-name {
    font-size: 15px;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 7px;
}

.card-code {
    font-size: 14px;
    font-weight: 700;
    color: #333;
}

.card-price {
    font-size: 14px;
    margin-top: 4px;
    color: #555;
}

.card-date {
    font-size: 13px;
    margin-top: 3px;
    color: #888;
}

/* =========================
   DETAY PENCERESİ
========================= */

.dialog-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.58);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
}

.dialog-overlay.show {
    display: flex;
}

.dialog {
    width: 100%;
    max-width: 420px;
    max-height: 90vh;
    overflow-y: auto;
    background: #fff;
    border-radius: 20px;
    padding: 18px;
    position: relative;
}

.dialog-close {
    position: absolute;
    right: 12px;
    top: 10px;
    width: 36px;
    height: 36px;
    border: 0;
    border-radius: 50%;
    background: #eeeeee;
    font-size: 22px;
    cursor: pointer;
}

.dialog-image {
    width: 100%;
    height: 250px;
    object-fit: contain;
    background: #f7f7f7;
    border-radius: 14px;
    margin-bottom: 15px;
}

.dialog-title {
    font-size: 20px;
    font-weight: 800;
    line-height: 1.35;
    margin-bottom: 16px;
    padding-right: 35px;
}

.detail-row {
    padding: 11px 0;
    border-bottom: 1px solid #eeeeee;
}

.detail-label {
    font-size: 12px;
    color: #888;
    margin-bottom: 4px;
}

.detail-value {
    font-size: 16px;
    font-weight: 700;
}

/* =========================
   KAMERA
========================= */

.scanner-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: #000;
    display: none;
}

.scanner-overlay.show {
    display: block;
}

.scanner-header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 210;
    padding: 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: #fff;
}

.scanner-title {
    font-size: 18px;
    font-weight: 700;
}

.scanner-close {
    width: 40px;
    height: 40px;
    border: 0;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    color: #fff;
    font-size: 22px;
}

#video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.scan-box {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 75%;
    max-width: 340px;
    height: 180px;
    transform: translate(-50%, -50%);
    border: 2px solid #fff;
    border-radius: 14px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.35);
}

.scan-text {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 25px;
    text-align: center;
    color: #fff;
    font-size: 15px;
}

/* =========================
   ERİŞİM ENGELİ
========================= */

.access-overlay {
    position: fixed;
    inset: 0;
    z-index: 500;
    background: #f5f5f5;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.access-overlay.show {
    display: flex;
}

.access-box {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border-radius: 20px;
    padding: 30px 22px;
    text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}

.access-icon {
    font-size: 48px;
    margin-bottom: 15px;
}

.access-title {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 12px;
}

.access-message {
    font-size: 15px;
    line-height: 1.5;
    color: #666;
}

/* =========================
   YÜKLENİYOR
========================= */

.loading-overlay {
    position: fixed;
    inset: 0;
    z-index: 450;
    background: #f5f5f5;
    display: flex;
    align-items: center;
    justify-content: center;
}

.loading-overlay.hidden {
    display: none;
}

.loading-box {
    text-align: center;
}

.loading-spinner {
    width: 42px;
    height: 42px;
    border: 4px solid #ddd;
    border-top-color: #222;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 15px;
}

.loading-text {
    font-size: 15px;
    color: #666;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}
</style>
</head>

<body>

<!-- =========================
     YÜKLENİYOR
========================= -->

<div id="loadingOverlay" class="loading-overlay">

    <div class="loading-box">

        <div class="loading-spinner"></div>

        <div class="loading-text">
            KısaKod hazırlanıyor...
        </div>

    </div>

</div>


<!-- =========================
     ERİŞİM ENGELİ
========================= -->

<div id="accessOverlay" class="access-overlay">

    <div class="access-box">

        <div class="access-icon">
            🔒
        </div>

        <div class="access-title">
            KısaKod
        </div>

        <div
            id="accessMessage"
            class="access-message">
            Kullanım bilgileriniz kontrol ediliyor...
        </div>

    </div>

</div>


<!-- =========================
     ANA SAYFA
========================= -->

<div class="header">

    <div class="title">
        KısaKod
    </div>

    <div class="search-row">

        <input
            id="searchInput"
            class="search-box"
            type="search"
            placeholder="Ürün ara..."
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
        >

        <button
            id="cameraBtn"
            class="camera-btn"
            type="button">
            📷
        </button>

    </div>

</div>


<div
    id="status"
    class="status">
    Ürün aramak için yukarıdaki alanı kullanın.
</div>


<div
    id="cards"
    class="cards">
</div>


<!-- =========================
     ÜRÜN DETAY PENCERESİ
========================= -->

<div
    id="productDialog"
    class="dialog-overlay">

    <div class="dialog">

        <button
            id="dialogClose"
            class="dialog-close"
            type="button">
            ×
        </button>

        <img
            id="dialogImage"
            class="dialog-image"
            src=""
            alt=""
        >

        <div
            id="dialogTitle"
            class="dialog-title">
        </div>

        <div class="detail-row">

            <div class="detail-label">
                Kısa Kod
            </div>

            <div
                id="dialogCode"
                class="detail-value">
            </div>

        </div>

        <div class="detail-row">

            <div class="detail-label">
                Fiyat
            </div>

            <div
                id="dialogPrice"
                class="detail-value">
            </div>

        </div>

        <div class="detail-row">

            <div class="detail-label">
                Tarih
            </div>

            <div
                id="dialogDate"
                class="detail-value">
            </div>

        </div>

        <!-- BARKOD BİLEREK GÖSTERİLMİYOR -->

    </div>

</div>


<!-- =========================
     BARKOD TARAYICI
========================= -->

<div
    id="scannerOverlay"
    class="scanner-overlay">

    <div class="scanner-header">

        <div class="scanner-title">
            Barkod Tara
        </div>

        <button
            id="scannerClose"
            class="scanner-close"
            type="button">
            ×
        </button>

    </div>

    <video
        id="video"
        autoplay
        muted
        playsinline>
    </video>

    <div class="scan-box"></div>

    <div class="scan-text">
        Barkodu çerçevenin içine getirin
    </div>

</div>


<!-- Telegram Web App kütüphanesi -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>


<script>

/* =====================================================
   TELEGRAM MINI APP
===================================================== */

const telegramAvailable =
    !!(
        window.Telegram &&
        Telegram.WebApp
    );


let telegramWebApp = null;
let telegramInitData = "";


/*
   Telegram Mini App bilgilerini al.
*/

if (telegramAvailable) {

    telegramWebApp = Telegram.WebApp;

    telegramWebApp.ready();
    telegramWebApp.expand();

    telegramInitData =
        telegramWebApp.initData || "";

}


/* =====================================================
   API ADRESİ
===================================================== */

const API_URL =
    "https://script.google.com/macros/s/AKfycbwdNLKE8cwW6GXOAfq2-WBWRbPoKI8W261erNS0JNq-OQak6682zhnuaZQO__zPudVBIg/exec";


/* =====================================================
   DEĞİŞKENLER
===================================================== */

let currentProducts = [];

let searchTimer = null;

let videoStream = null;

let scannerRunning = false;

let barcodeDetector = null;

let miniAppAuthorized = false;


/* =====================================================
   HTML ELEMENTLERİ
===================================================== */

const loadingOverlay =
    document.getElementById("loadingOverlay");

const accessOverlay =
    document.getElementById("accessOverlay");

const accessMessage =
    document.getElementById("accessMessage");

const statusElement =
    document.getElementById("status");

const cardsElement =
    document.getElementById("cards");

const searchInput =
    document.getElementById("searchInput");


/* =====================================================
   ERİŞİM MESAJI
===================================================== */

function showAccessMessage(message) {

    loadingOverlay.classList.add("hidden");

    accessMessage.textContent =
        message || "Erişim izniniz bulunmuyor.";

    accessOverlay.classList.add("show");

}


/* =====================================================
   TELEGRAM KONTROLÜ
===================================================== */

async function miniAppYetkiKontrol() {

    /*
       Telegram dışından açılmışsa
       çalışmasına izin verme.
    */

    if (!telegramAvailable) {

        showAccessMessage(
            "Bu uygulama yalnızca Telegram üzerinden kullanılabilir."
        );

        return false;
    }


    /*
       Telegram initData yoksa
       güvenli şekilde durdur.
    */

    if (!telegramInitData) {

        showAccessMessage(
            "Telegram kullanıcı bilgileri alınamadı. Lütfen uygulamayı Telegram içerisinden tekrar açın."
        );

        return false;
    }


    try {

        /*
           Boş URUN_ARA isteği gönderiyoruz.

           Apps Script tarafı:
           - initData doğrular
           - Telegram ID'yi bulur
           - 30 günlük süreyi başlatır
           - süresi dolmuşsa erişimi reddeder
        */

        const url =
            API_URL +
            "?func=URUN_ARA" +
            "&query=" +
            encodeURIComponent("") +
            "&initData=" +
            encodeURIComponent(telegramInitData);


        const response =
            await fetch(url, {
                method: "GET",
                cache: "no-store"
            });


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }


        const data =
            await response.json();


        /*
           Apps Script erişim hatasını
           JSON içindeki mesajdan yakala.
        */

        if (
            data &&
            data.ok === false
        ) {

            showAccessMessage(
                data.message ||
                "Bu uygulamayı kullanma yetkiniz bulunmuyor."
            );

            return false;
        }


        /*
           Bazı Apps Script sürümlerinde
           hata şu şekilde dönebilir:
        */

        if (
            data &&
            data.hata
        ) {

            showAccessMessage(
                data.hata
            );

            return false;
        }


        /*
           Yetki kontrolü başarılı.
        */

        miniAppAuthorized = true;

        loadingOverlay.classList.add("hidden");

        return true;


    } catch (error) {

        console.error(
            "Telegram yetki kontrolü hatası:",
            error
        );


        showAccessMessage(
            "Kullanım bilgileriniz kontrol edilemedi. Lütfen uygulamayı Telegram üzerinden tekrar açın."
        );


        return false;
    }

}


/* =====================================================
   TÜRKÇE NORMALİZASYON
===================================================== */

function normalizeText(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .toLocaleLowerCase("tr-TR")
        .replace(/ı/g, "i")
        .replace(/İ/g, "i")
        .replace(/ğ/g, "g")
        .replace(/Ğ/g, "g")
        .replace(/ü/g, "u")
        .replace(/Ü/g, "u")
        .replace(/ş/g, "s")
        .replace(/Ş/g, "s")
        .replace(/ö/g, "o")
        .replace(/Ö/g, "o")
        .replace(/ç/g, "c")
        .replace(/Ç/g, "c")
        .trim();

}


/* =====================================================
   BARKOD NORMALİZASYONU
===================================================== */

function normalizeBarcode(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    let str =
        String(value)
            .trim()
            .replace(/\s+/g, "")
            .replace(/-/g, "");


    if (
        /^\d+\.0+$/.test(str)
    ) {

        str =
            str.split(".")[0];

    }


    str =
        str.replace(/\D/g, "");


    return str;

}


/* =====================================================
   BARKOD KARŞILAŞTIRMA
===================================================== */

function barcodeEquals(a, b) {

    const x =
        normalizeBarcode(a);

    const y =
        normalizeBarcode(b);


    if (!x || !y) {
        return false;
    }


    if (x === y) {
        return true;
    }


    const x2 =
        x.replace(/^0+/, "");

    const y2 =
        y.replace(/^0+/, "");


    return (
        x2 !== "" &&
        y2 !== "" &&
        x2 === y2
    );

}


/* =====================================================
   HTML GÜVENLİ METİN
===================================================== */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   ÜRÜN OBJESİ
===================================================== */

function convertRow(row) {

    return {

        code:
            row[0] ?? "",

        name:
            row[1] ?? "",

        price:
            row[2] ?? "",

        date:
            row[3] ?? "",

        image:
            row[4] ?? "",

        barcode:
            row[5] ?? ""

    };

}


/* =====================================================
   ÜRÜN ARAMA
===================================================== */

async function searchProducts(query) {

    /*
       Yetki yoksa arama yapma.
    */

    if (!miniAppAuthorized) {

        showAccessMessage(
            "KısaKod kullanım izniniz bulunmuyor."
        );

        return;
    }


    query =
        String(query || "").trim();


    if (!query) {

        currentProducts = [];

        cardsElement.innerHTML = "";

        statusElement.textContent =
            "Ürün aramak için yukarıdaki alanı kullanın.";

        return;
    }


    statusElement.textContent =
        "Aranıyor...";


    try {

        let searchQuery =
            query;


        const digitsOnly =
            normalizeBarcode(query);


        /*
           8-14 haneli sayı barkod
           olarak kabul edilir.
        */

        if (
            digitsOnly.length >= 8 &&
            digitsOnly.length <= 14
        ) {

            searchQuery =
                digitsOnly;

        }


        /*
           Telegram initData
           her ürün aramasında gönderiliyor.
        */

        const url =
            API_URL +
            "?func=URUN_ARA" +
            "&query=" +
            encodeURIComponent(searchQuery) +
            "&initData=" +
            encodeURIComponent(telegramInitData);


        const response =
            await fetch(url, {
                method: "GET",
                cache: "no-store"
            });


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }


        const data =
            await response.json();


        /*
           Yetki / süre hatası.
        */

        if (
            data &&
            data.ok === false
        ) {

            miniAppAuthorized = false;

            showAccessMessage(
                data.message ||
                "Kullanım süreniz sona ermiş."
            );

            return;
        }


        if (
            data &&
            data.hata
        ) {

            miniAppAuthorized = false;

            showAccessMessage(
                data.hata
            );

            return;
        }


        if (!Array.isArray(data)) {

            throw new Error(
                "Geçersiz veri"
            );

        }


        currentProducts =
            data.map(convertRow);


        /*
           Barkod aramasıysa
           kesin barkod eşleşmesi.
        */

        if (
            digitsOnly.length >= 8 &&
            digitsOnly.length <= 14
        ) {

            const exactMatches =
                currentProducts.filter(
                    product =>
                        barcodeEquals(
                            product.barcode,
                            digitsOnly
                        )
                );


            if (
                exactMatches.length > 0
            ) {

                currentProducts =
                    exactMatches;

            }

        }


        renderProducts(
            currentProducts
        );


    } catch (error) {

        console.error(
            "Arama hatası:",
            error
        );


        currentProducts = [];

        cardsElement.innerHTML = "";

        statusElement.textContent =
            "Arama sırasında bir hata oluştu.";

    }

}


/* =====================================================
   ÜRÜN KARTLARINI GÖSTER
===================================================== */

function renderProducts(products) {

    cardsElement.innerHTML = "";


    if (!products.length) {

        statusElement.textContent =
            "Ürün bulunamadı.";

        return;
    }


    statusElement.textContent =
        products.length +
        " sonuç bulundu.";


    const fragment =
        document.createDocumentFragment();


    products.forEach(
        (product, index) => {

            const card =
                document.createElement("div");


            card.className =
                "card";


            card.dataset.index =
                index;


            const image =
                product.image
                    ? escapeHTML(product.image)
                    : "";


            const imageHTML =
                image
                    ? `
                        <img
                            class="card-image"
                            src="${image}"
                            alt=""
                            loading="lazy"
                            onerror="this.style.visibility='hidden'"
                        >
                      `
                    : `
                        <div class="card-image"></div>
                      `;


            card.innerHTML = `

                ${imageHTML}

                <div class="card-info">

                    <div class="card-name">
                        ${escapeHTML(product.name)}
                    </div>

                    <div class="card-code">
                        Stok Kodu:
                        ${escapeHTML(product.code)}
                    </div>

                    <div class="card-price">
                        ${escapeHTML(product.price)}
                    </div>

                    <div class="card-date">
                        Satış Tarihi:
                        ${escapeHTML(product.date)}
                    </div>

                </div>

            `;


            fragment.appendChild(card);

        }
    );


    cardsElement.appendChild(
        fragment
    );

}


/* =====================================================
   KART TIKLAMA
===================================================== */

cardsElement.addEventListener(
    "click",
    function(event) {

        const card =
            event.target.closest(".card");


        if (!card) {
            return;
        }


        const index =
            Number(card.dataset.index);


        const product =
            currentProducts[index];


        if (!product) {
            return;
        }


        openProductDialog(
            product
        );

    }
);


/* =====================================================
   ÜRÜN DETAY PENCERESİ
===================================================== */

function openProductDialog(product) {

    const dialog =
        document.getElementById(
            "productDialog"
        );


    const image =
        document.getElementById(
            "dialogImage"
        );


    const title =
        document.getElementById(
            "dialogTitle"
        );


    const code =
        document.getElementById(
            "dialogCode"
        );


    const price =
        document.getElementById(
            "dialogPrice"
        );


    const date =
        document.getElementById(
            "dialogDate"
        );


    title.textContent =
        product.name || "-";


    code.textContent =
        product.code || "-";


    price.textContent =
        product.price || "-";


    date.textContent =
        product.date || "-";


    /*
       Barkod burada kesinlikle gösterilmiyor.
    */


    if (product.image) {

        image.src =
            product.image;

        image.style.visibility =
            "visible";

    } else {

        image.removeAttribute("src");

        image.style.visibility =
            "hidden";

    }


    dialog.classList.add(
        "show"
    );

}


/* =====================================================
   DETAY PENCERESİNİ KAPAT
===================================================== */

function closeProductDialog() {

    document
        .getElementById(
            "productDialog"
        )
        .classList.remove(
            "show"
        );

}


document
    .getElementById(
        "dialogClose"
    )
    .addEventListener(
        "click",
        closeProductDialog
    );


document
    .getElementById(
        "productDialog"
    )
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                closeProductDialog();

            }

        }
    );


/* =====================================================
   ESC
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            closeProductDialog();

            closeScanner();

        }

    }
);


/* =====================================================
   ARAMA KUTUSU
===================================================== */

searchInput.addEventListener(
    "input",
    function() {

        const value =
            this.value.trim();


        clearTimeout(
            searchTimer
        );


        searchTimer =
            setTimeout(
                function() {

                    searchProducts(
                        value
                    );

                },
                350
            );

    }
);


/* =====================================================
   ENTER İLE HEMEN ARA
===================================================== */

searchInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            clearTimeout(
                searchTimer
            );

            searchProducts(
                this.value
            );

        }

    }
);


/* =====================================================
   BARKOD TARAYICI
===================================================== */

document
    .getElementById(
        "cameraBtn"
    )
    .addEventListener(
        "click",
        startScanner
    );


/* =====================================================
   BARKOD FORMATLARI
===================================================== */

const barcodeFormats = [

    "ean_13",
    "ean_8",
    "upc_a",
    "upc_e",
    "code_128",
    "code_39",
    "itf",
    "codabar",
    "qr_code"

];


/* =====================================================
   SCANNER BAŞLAT
===================================================== */

async function startScanner() {

    if (!miniAppAuthorized) {

        showAccessMessage(
            "KısaKod kullanım izniniz bulunmuyor."
        );

        return;
    }


    if (
        !("BarcodeDetector" in window)
    ) {

        alert(
            "Bu tarayıcı barkod taramayı desteklemiyor."
        );

        return;
    }


    try {

        if (
            BarcodeDetector.getSupportedFormats
        ) {

            const supported =
                await BarcodeDetector
                    .getSupportedFormats();


            const usableFormats =
                barcodeFormats.filter(
                    format =>
                        supported.includes(
                            format
                        )
                );


            barcodeDetector =
                new BarcodeDetector({
                    formats:
                        usableFormats
                });

        } else {

            barcodeDetector =
                new BarcodeDetector({
                    formats:
                        barcodeFormats
                });

        }


        const stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {
                            ideal:
                                "environment"
                        },

                        width: {
                            ideal:
                                1280
                        },

                        height: {
                            ideal:
                                720
                        }

                    },

                    audio: false

                });


        videoStream =
            stream;


        const video =
            document.getElementById(
                "video"
            );


        video.srcObject =
            stream;


        await video.play();


        document
            .getElementById(
                "scannerOverlay"
            )
            .classList.add(
                "show"
            );


        scannerRunning =
            true;


        scanBarcodeLoop();


    } catch (error) {

        console.error(
            "Kamera hatası:",
            error
        );


        alert(
            "Kamera açılamadı. Kamera iznini kontrol edin."
        );


        closeScanner();

    }

}


/* =====================================================
   BARKOD TARAMA DÖNGÜSÜ
===================================================== */

async function scanBarcodeLoop() {

    if (!scannerRunning) {
        return;
    }


    const video =
        document.getElementById(
            "video"
        );


    try {

        if (
            video.readyState >= 2 &&
            barcodeDetector
        ) {

            const codes =
                await barcodeDetector
                    .detect(video);


            if (
                codes &&
                codes.length > 0
            ) {

                const rawCode =
                    codes[0].rawValue;


                if (rawCode) {

                    await handleScannedBarcode(
                        rawCode
                    );

                    return;

                }

            }

        }

    } catch (error) {

        console.log(
            "Tarama:",
            error
        );

    }


    if (scannerRunning) {

        requestAnimationFrame(
            scanBarcodeLoop
        );

    }

}


/* =====================================================
   OKUNAN BARKODU ARA
===================================================== */

async function handleScannedBarcode(
    rawCode
) {

    const barcode =
        normalizeBarcode(
            rawCode
        );


    if (!barcode) {
        return;
    }


    scannerRunning =
        false;


    searchInput.value =
        barcode;


    closeScanner();


    await searchProducts(
        barcode
    );

}


/* =====================================================
   SCANNER KAPAT
===================================================== */

function closeScanner() {

    scannerRunning =
        false;


    if (videoStream) {

        videoStream
            .getTracks()
            .forEach(
                function(track) {

                    track.stop();

                }
            );


        videoStream =
            null;

    }


    const video =
        document.getElementById(
            "video"
        );


    video.srcObject =
        null;


    document
        .getElementById(
            "scannerOverlay"
        )
        .classList.remove(
            "show"
        );

}


document
    .getElementById(
        "scannerClose"
    )
    .addEventListener(
        "click",
        closeScanner
    );


/* =====================================================
   SAYFA BAŞLANGICI
===================================================== */

           Telegram + 30 günlük kullanım
           kontrolü yapılır.
        */

        await miniAppYetkiKontrol();

    }
);
