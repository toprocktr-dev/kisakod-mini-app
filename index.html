<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>KısaKod PLUS</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script src="https://unpkg.com/@zxing/browser@0.2.1"></script>


<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #f4f5f7;
  font-family: Arial, sans-serif;
}

body {
  overflow-x: hidden;
}

.header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: #ffffff;
  padding: 12px;
  border-bottom: 1px solid #ddd;
}

.title {
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 10px;
}

.search-row {
  display: flex;
  gap: 7px;
}

.search-input {
  flex: 1;
  height: 45px;
  border: 1px solid #ccc;
  border-radius: 10px;
  padding: 0 12px;
  font-size: 16px;
  outline: none;
  background: #fff;
}

.search-input:focus {
  border-color: #777;
}

.search-button {
  width: 70px;
  height: 45px;
  border: 0;
  border-radius: 10px;
  background: #111;
  color: white;
  font-size: 15px;
  font-weight: bold;
}

.barcode-button {
  width: 48px;
  height: 45px;
  border: 0;
  border-radius: 10px;
  background: #e9eaed;
  font-size: 22px;
}

.search-button:active,
.barcode-button:active {
  transform: scale(.96);
}

.status {
  text-align: center;
  padding: 12px;
  font-size: 14px;
  color: #666;
}

.results {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 8px 10px 20px;
}

.product-card {
  width: 100%;
  background: #fff;
  border-radius: 12px;
  padding: 9px;
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid #e3e3e3;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
}

.product-image {
  width: 90px;
  height: 90px;
  min-width: 90px;
  border-radius: 9px;
  object-fit: cover;
  background: #eee;
}

.product-info {
  flex: 1;
  min-width: 0;
}

.product-name {
  font-size: 15px;
  font-weight: bold;
  line-height: 1.25;
  margin-bottom: 7px;
  word-break: break-word;
}

.product-code {
  font-size: 13px;
  color: #555;
  margin-bottom: 4px;
}

.product-price {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 4px;
}

.product-date {
  font-size: 13px;
  color: #666;
}

.empty {
  text-align: center;
  padding: 35px 15px;
  color: #777;
  font-size: 15px;
}

.loading {
  text-align: center;
  padding: 25px;
  color: #666;
}

.modal {
  display: none;
  position: fixed;
  z-index: 100;
  inset: 0;
  background: rgba(0,0,0,.55);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-box {
  width: 100%;
  max-width: 420px;
  background: white;
  border-radius: 16px;
  padding: 15px;
  max-height: 90vh;
  overflow-y: auto;
}

.modal-image {
  width: 100%;
  max-height: 300px;
  object-fit: contain;
  border-radius: 12px;
  background: #f2f2f2;
}

.modal-title {
  font-size: 19px;
  font-weight: bold;
  margin-top: 12px;
}

.modal-text {
  margin-top: 8px;
  line-height: 1.5;
  color: #444;
}

.close-button {
  width: 100%;
  margin-top: 15px;
  height: 43px;
  border: 0;
  border-radius: 10px;
  background: #111;
  color: white;
  font-size: 15px;
}

.scanner {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 200;
  background: #000;
}

.scanner video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.scanner-close {
  position: absolute;
  z-index: 201;
  top: 20px;
  right: 15px;
  width: 45px;
  height: 45px;
  border: 0;
  border-radius: 50%;
  background: rgba(255,255,255,.9);
  font-size: 22px;
}

.scanner-line {
  position: absolute;
  left: 10%;
  right: 10%;
  top: 50%;
  height: 2px;
  background: red;
}

</style>

</head>


<body>


<div class="header">

  <div class="title">
    🔎 KısaKod PLUS
  </div>

  <div class="search-row">

    <input
      id="searchInput"
      class="search-input"
      type="search"
      placeholder="Ürün adı, kod veya barkod"
      autocomplete="off"
      autocorrect="off"
      spellcheck="false"
    >

    <button
      id="searchButton"
      class="search-button"
    >
      Ara
    </button>

    <button
      id="barcodeButton"
      class="barcode-button"
    >
      📷
    </button>

  </div>

</div>


<div
  id="status"
  class="status"
>
  Hazırlanıyor...
</div>


<div
  id="results"
  class="results"
></div>


<!-- ÜRÜN DETAY -->

<div
  id="productModal"
  class="modal"
>

  <div class="modal-box">

    <img
      id="modalImage"
      class="modal-image"
      src=""
      alt=""
    >

    <div
      id="modalTitle"
      class="modal-title"
    ></div>

    <div
      id="modalText"
      class="modal-text"
    ></div>

    <button
      id="closeModal"
      class="close-button"
    >
      Kapat
    </button>

  </div>

</div>


<!-- BARKOD -->

<div
  id="scanner"
  class="scanner"
>

  <video
    id="scannerVideo"
    playsinline
  ></video>

  <div
    class="scanner-line"
  ></div>

  <button
    id="scannerClose"
    class="scanner-close"
  >
    ✕
  </button>

</div>


<script>


/*************************************************
 * TELEGRAM
 *************************************************/

const telegramWebApp =
  window.Telegram &&
  window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;


if (telegramWebApp) {

  telegramWebApp.ready();

  telegramWebApp.expand();

}


/*************************************************
 * API
 *************************************************/

const API_URL =
  "https://script.google.com/macros/s/AKfycbzwSq-HHheSAqBO0EVCaQlG0EwyMs9alML4p1n-9TiL60CTh5RWXFarOVO2VJvPScWx8w/exec";


/*************************************************
 * ELEMENTLER
 *************************************************/

const searchInput =
  document.getElementById(
    "searchInput"
  );

const searchButton =
  document.getElementById(
    "searchButton"
  );

const barcodeButton =
  document.getElementById(
    "barcodeButton"
  );

const results =
  document.getElementById(
    "results"
  );

const status =
  document.getElementById(
    "status"
  );


/*************************************************
 * INIT DATA
 *************************************************/

function getInitData() {

  if (!telegramWebApp) {

    return "";
  }

  return (
    telegramWebApp.initData ||
    ""
  );
}


/*************************************************
 * YETKİ KONTROL
 *************************************************/

async function miniAppYetkiKontrol() {

  const initData =
    getInitData();


  if (!initData) {

    status.textContent =
      "❌ Telegram doğrulaması bulunamadı.";

    results.innerHTML = "";

    return false;
  }


  try {

    const url =
      API_URL +
      "?func=URUN_ARA" +
      "&initData=" +
      encodeURIComponent(
        initData
      ) +
      "&query=";


    const response =
      await fetch(
        url
      );


    const data =
      await response.json();


    if (
      data &&
      data.ok === false
    ) {

      status.textContent =
        data.hata ||
        "❌ Kullanım yetkiniz yok.";

      return false;
    }


    status.textContent =
      "Ürün aramaya hazır.";

    return true;


  } catch (err) {

    console.error(
      err
    );

    status.textContent =
      "❌ Sunucu bağlantısı kurulamadı.";

    return false;
  }
}


/*************************************************
 * ÜRÜN ARA
 *************************************************/

let sonArama = "";


async function searchProducts(
  force = false
) {

  const query =
    String(
      searchInput.value ||
      ""
    ).trim();


  if (!query) {

    return;
  }


  if (
    !force &&
    query === sonArama
  ) {

    return;
  }


  sonArama =
    query;


  const initData =
    getInitData();


  if (!initData) {

    status.textContent =
      "❌ Telegram doğrulaması bulunamadı.";

    return;
  }


  searchButton.disabled =
    true;

  status.textContent =
    "🔎 Aranıyor...";

  results.innerHTML =
    '<div class="loading">Ürünler aranıyor...</div>';


  try {

    const url =
      API_URL +
      "?func=URUN_ARA" +
      "&initData=" +
      encodeURIComponent(
        initData
      ) +
      "&query=" +
      encodeURIComponent(
        query
      );


    const response =
      await fetch(
        url
      );


    const data =
      await response.json();


    if (
      data &&
      data.ok === false
    ) {

      results.innerHTML = "";

      status.textContent =
        data.hata ||
        "❌ Arama yapılamadı.";

      return;
    }


    renderResults(
      Array.isArray(data)
        ? data
        : []
    );


  } catch (err) {

    console.error(
      err
    );

    results.innerHTML =
      '<div class="empty">❌ Bağlantı hatası oluştu.</div>';

    status.textContent =
      "Bağlantı hatası.";

  } finally {

    searchButton.disabled =
      false;
  }
}


/*************************************************
 * SONUÇLARI GÖSTER
 *************************************************/

function renderResults(
  data
) {

  results.innerHTML = "";


  if (
    !data ||
    data.length === 0
  ) {

    status.textContent =
      "❌ Ürün bulunamadı.";

    results.innerHTML =
      '<div class="empty">Ürün bulunamadı.</div>';

    return;
  }


  status.textContent =
    data.length +
    " ürün bulundu.";


  data.forEach(
    function(urun) {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "product-card";


      const img =
        document.createElement(
          "img"
        );

      img.className =
        "product-image";

      img.alt =
        urun.kod ||
        "Ürün";


      if (
        urun.link
      ) {

        img.src =
          urun.link;

      } else {

        img.style.visibility =
          "hidden";
      }


      const info =
        document.createElement(
          "div"
        );

      info.className =
        "product-info";


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "product-name";

      name.textContent =
        urun.kod ||
        "Ürün";


      const code =
        document.createElement(
          "div"
        );

      code.className =
        "product-code";

      code.textContent =
        "🔢 Kod: " +
        (
          urun.urunKodu ||
          ""
        );


      const price =
        document.createElement(
          "div"
        );

      price.className =
        "product-price";

      price.textContent =
        "💰 Fiyat: " +
        (
          urun.fiyat ||
          ""
        );


      const date =
        document.createElement(
          "div"
        );

      date.className =
        "product-date";

      date.textContent =
        "📅 Satış Tarihi: " +
        (
          urun.tarih ||
          ""
        );


      info.appendChild(
        name
      );

      info.appendChild(
        code
      );

      info.appendChild(
        price
      );

      info.appendChild(
        date
      );


      card.appendChild(
        img
      );

      card.appendChild(
        info
      );


      card.addEventListener(
        "click",
        function() {

          showProductDetail(
            urun
          );

        }
      );


      results.appendChild(
        card
      );

    }
  );
}


/*************************************************
 * ÜRÜN DETAY
 *************************************************/

function showProductDetail(
  urun
) {

  const modal =
    document.getElementById(
      "productModal"
    );

  const modalImage =
    document.getElementById(
      "modalImage"
    );

  const modalTitle =
    document.getElementById(
      "modalTitle"
    );

  const modalText =
    document.getElementById(
      "modalText"
    );


  if (
    urun.link
  ) {

    modalImage.src =
      urun.link;

    modalImage.style.display =
      "block";

  } else {

    modalImage.style.display =
      "none";
  }


  modalTitle.textContent =
    urun.kod ||
    "Ürün";


  modalText.innerHTML =
    "🔢 Kod: " +
    escapeHtml(
      urun.urunKodu || ""
    ) +

    "<br><br>💰 Fiyat: " +
    escapeHtml(
      urun.fiyat || ""
    ) +

    "<br><br>📅 Satış Tarihi: " +
    escapeHtml(
      urun.tarih || ""
    );


  modal.style.display =
    "flex";
}


/*************************************************
 * HTML GÜVENLİ
 *************************************************/

function escapeHtml(
  value
) {

  return String(
    value || ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


/*************************************************
 * MODAL KAPAT
 *************************************************/

document
  .getElementById(
    "closeModal"
  )
  .addEventListener(
    "click",
    function() {

      document
        .getElementById(
          "productModal"
        )
        .style.display =
        "none";

    }
  );


document
  .getElementById(
    "productModal"
  )
  .addEventListener(
    "click",
    function(e) {

      if (
        e.target === this
      ) {

        this.style.display =
          "none";
      }

    }
  );


/*************************************************
 * ARAMA BUTONU
 *************************************************/

searchButton.addEventListener(
  "click",
  function() {

    searchProducts(
      true
    );

  }
);


/*************************************************
 * ENTER
 *************************************************/

searchInput.addEventListener(
  "keydown",
  function(e) {

    if (
      e.key === "Enter"
    ) {

      e.preventDefault();

      searchProducts(
        true
      );
    }

  }
);


/*************************************************
 * KLAVYE KAPANINCA ARA
 *************************************************/

let keyboardWasOpen =
  false;


if (
  window.visualViewport
) {

  window.visualViewport.addEventListener(
    "resize",
    function() {

      const height =
        window.visualViewport.height;

      const windowHeight =
        window.innerHeight;


      const keyboardOpen =
        windowHeight -
        height >
        150;


      if (
        keyboardOpen
      ) {

        keyboardWasOpen =
          true;

      } else if (
        keyboardWasOpen
      ) {

        keyboardWasOpen =
          false;

        if (
          searchInput.value.trim()
        ) {

          searchProducts(
            true
          );
        }
      }

    }
  );
}


/*************************************************
 * BARKOD TARAYICI
 *************************************************/

let codeReader =
  null;

let scannerControls =
  null;


async function startScanner() {

  const scanner =
    document.getElementById(
      "scanner"
    );

  const video =
    document.getElementById(
      "scannerVideo"
    );


  scanner.style.display =
    "block";


  try {

    codeReader =
      new ZXingBrowser.BrowserMultiFormatReader();


    scannerControls =
      await codeReader.decodeFromVideoDevice(
        undefined,
        video,
        function(result, error) {

          if (
            result
          ) {

            const barkod =
              result.getText();


            stopScanner();


            searchInput.value =
              barkod;


            searchProducts(
              true
            );
          }

        }
      );


  } catch (err) {

    console.error(
      err
    );

    alert(
      "Kamera açılamadı."
    );

    stopScanner();
  }
}


/*************************************************
 * SCANNER DURDUR
 *************************************************/

function stopScanner() {

  if (
    scannerControls
  ) {

    try {

      scannerControls.stop();

    } catch (e) {}

    scannerControls =
      null;
  }


  if (
    codeReader
  ) {

    try {

      codeReader.reset();

    } catch (e) {}

    codeReader =
      null;
  }


  const scanner =
    document.getElementById(
      "scanner"
    );


  scanner.style.display =
    "none";
}


/*************************************************
 * BARKOD BUTONU
 *************************************************/

barcodeButton.addEventListener(
  "click",
  function() {

    startScanner();

  }
);


/*************************************************
 * SCANNER KAPAT
 *************************************************/

document
  .getElementById(
    "scannerClose"
  )
  .addEventListener(
    "click",
    function() {

      stopScanner();

    }
  );


/*************************************************
 * TELEGRAM BACK BUTTON
 *************************************************/

if (
  telegramWebApp
) {

  telegramWebApp.BackButton.onClick(
    function() {

      const modal =
        document.getElementById(
          "productModal"
        );

      const scanner =
        document.getElementById(
          "scanner"
        );


      if (
        scanner.style.display ===
        "block"
      ) {

        stopScanner();

        return;
      }


      if (
        modal.style.display ===
        "flex"
      ) {

        modal.style.display =
          "none";

        return;
      }


      telegramWebApp.close();

    }
  );

}


/*************************************************
 * BAŞLANGIÇ
 *************************************************/

document.addEventListener(
  "DOMContentLoaded",
  async function() {

    if (
      !telegramWebApp
    ) {

      status.textContent =
        "❌ Bu uygulama Telegram içinden açılmalıdır.";

      return;
    }


    await miniAppYetkiKontrol();

  }
);

</script>

</body>

</html>
