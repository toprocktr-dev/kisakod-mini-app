<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KısaKod PLUS</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/@zxing/browser@0.2.1"></script>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #f4f5f7;
  font-family: Arial, sans-serif;
}

body {
  overflow-x: hidden;
}

.header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: #fff;
  padding: 12px;
  border-bottom: 1px solid #ddd;
}

.title {
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 10px;
}

.search-row {
  display: flex;
  gap: 7px;
}

.search-input {
  flex: 1;
  min-width: 0;
  height: 45px;
  border: 1px solid #ccc;
  border-radius: 10px;
  padding: 0 12px;
  font-size: 16px;
  outline: none;
  background: #fff;
}

.search-input:focus {
  border-color: #777;
}

.search-button {
  width: 70px;
  height: 45px;
  border: 0;
  border-radius: 10px;
  background: #111;
  color: white;
  font-size: 15px;
  font-weight: bold;
}

.barcode-button {
  width: 48px;
  height: 45px;
  border: 0;
  border-radius: 10px;
  background: #e9eaed;
  font-size: 22px;
}

.search-button:active,
.barcode-button:active {
  transform: scale(.96);
}

.status {
  text-align: center;
  padding: 12px;
  font-size: 14px;
  color: #666;
}

.results {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 8px 10px 20px;
}

.product-card {
  width: 100%;
  background: #fff;
  border-radius: 12px;
  padding: 9px;
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid #e3e3e3;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
}

.product-image {
  width: 90px;
  height: 90px;
  min-width: 90px;
  border-radius: 9px;
  object-fit: cover;
  background: #eee;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  pointer-events: none;
}

.product-info {
  flex: 1;
  min-width: 0;
}

.product-name {
  font-size: 15px;
  font-weight: bold;
  line-height: 1.25;
  margin-bottom: 7px;
  word-break: break-word;
}

.product-code {
  font-size: 13px;
  color: #555;
  margin-bottom: 4px;
}

.product-price {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 4px;
}

.product-date {
  font-size: 13px;
  color: #666;
}

.empty {
  text-align: center;
  padding: 35px 15px;
  color: #777;
  font-size: 15px;
}

.loading {
  text-align: center;
  padding: 25px;
  color: #666;
}

/* ÖZEL YÜKLENME EKRANI */
.loading-screen {
  position: fixed;
  inset: 0;
  z-index: 500;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(244,245,247,.96);
}

.loading-box {
  width: 100%;
  max-width: 320px;
  padding: 30px 20px;
  text-align: center;
  background: #fff;
  border: 1px solid #e5e9f0;
  border-radius: 22px;
  box-shadow: 0 12px 40px rgba(0,0,0,.10);
}

.custom-spinner {
  width: 64px;
  height: 64px;
  margin: 0 auto 20px;
  border: 6px solid #e5edff;
  border-top-color: #2468df;
  border-right-color: #2468df;
  border-radius: 50%;
  animation: kisakodSpin .8s linear infinite;
}

@keyframes kisakodSpin {
  to {
    transform: rotate(360deg);
  }
}

.loading-title {
  font-size: 18px;
  font-weight: bold;
  line-height: 1.4;
  color: #202938;
}

.loading-description {
  margin-top: 9px;
  color: #778196;
  font-size: 13px;
}

/* ÜRÜN DETAY PENCERESİ */
.modal {
  display: none;
  position: fixed;
  z-index: 100;
  inset: 0;
  background: rgba(0,0,0,.55);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-box {
  position: relative;
  width: 100%;
  max-width: 420px;
  background: white;
  border-radius: 20px;
  padding: 20px;
  max-height: 90vh;
  overflow-y: auto;
}

.modal-image {
  display: block;
  width: 100%;
  height: 190px;
  object-fit: contain;
  border-radius: 12px;
  background: #fff;
  margin: 0 auto 12px;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  pointer-events: none;
}

.modal-title {
  font-size: 18px;
  font-weight: 800;
  line-height: 1.4;
  text-align: center;
  margin: 8px 0 15px;
  color: #202938;
}

.modal-qr {
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 12px 0 17px;
}

#qrCode {
  min-width: 148px;
  min-height: 148px;
  padding: 8px;
  background: white;
  border: 1px solid #e6eaf0;
  border-radius: 12px;
}

#qrCode img,
#qrCode canvas {
  display: block;
  width: 132px !important;
  height: 132px !important;
}

.modal-price {
  padding: 12px;
  margin: 0 0 16px;
  border-radius: 12px;
  text-align: center;
  background: #fff0f0;
  color: #cf3434;
  font-size: 28px;
  font-weight: 900;
}

.modal-details {
  display: grid;
  grid-template-columns: 1fr 1.35fr;
  gap: 12px;
  align-items: start;
}

.modal-detail-item {
  min-width: 0;
}

.modal-detail-item + .modal-detail-item {
  border-left: 1px solid #e1e5ec;
  padding-left: 12px;
}

.modal-detail-label {
  font-size: 12px;
  color: #788397;
  margin-bottom: 6px;
}

.modal-detail-value {
  font-size: 15px;
  font-weight: 800;
  color: #202938;
  overflow-wrap: anywhere;
}

.close-button {
  width: 100%;
  margin-top: 15px;
  height: 43px;
  border: 0;
  border-radius: 10px;
  background: #111;
  color: white;
  font-size: 15px;
}

@media (max-width: 360px) {
  .modal-box {
    padding: 16px;
  }

  .modal-price {
    font-size: 25px;
  }

  .modal-detail-value {
    font-size: 13px;
  }
}

/* BARKOD TARAYICI */
.scanner {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 200;
  background: #000;
}

.scanner video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.scanner-close {
  position: absolute;
  z-index: 201;
  top: 20px;
  right: 15px;
  width: 45px;
  height: 45px;
  border: 0;
  border-radius: 50%;
  background: rgba(255,255,255,.9);
  font-size: 22px;
}

.scanner-line {
  position: absolute;
  left: 10%;
  right: 10%;
  top: 50%;
  height: 2px;
  background: red;
}
</style>
</head>

<body>

<div class="header">
  <div class="title">
    🔎 KısaKod PLUS
  </div>

  <div class="search-row">
    <input
      id="searchInput"
      class="search-input"
      type="search"
      placeholder="Ürün adı, kod veya barkod"
      autocomplete="off"
      autocorrect="off"
      spellcheck="false"
    >

    <button
      id="searchButton"
      class="search-button"
    >
      Ara
    </button>

    <button
      id="barcodeButton"
      class="barcode-button"
    >
      📷
    </button>
  </div>
</div>

<div id="status" class="status">
  Hazırlanıyor...
</div>

<div id="results" class="results"></div>

<!-- ÖZEL YÜKLENME EKRANI -->
<div id="loadingScreen" class="loading-screen">
  <div class="loading-box">
    <div class="custom-spinner"></div>
    <div id="loadingTitle" class="loading-title">
      Telegram doğrulanıyor...
    </div>
    <div id="loadingDescription" class="loading-description">
      Lütfen bekleyin.
    </div>
  </div>
</div>

<!-- ÜRÜN DETAY -->
<div id="productModal" class="modal">
  <div class="modal-box">
    <img
      id="modalImage"
      class="modal-image"
      src=""
      alt="Ürün görseli"
    >

    <div id="modalTitle" class="modal-title"></div>

    <div class="modal-qr">
      <div id="qrCode"></div>
    </div>

    <div id="modalPrice" class="modal-price"></div>

    <div class="modal-details">
      <div class="modal-detail-item">
        <div class="modal-detail-label">Ürün Kodu</div>
        <div id="modalCode" class="modal-detail-value"></div>
      </div>

      <div class="modal-detail-item">
        <div class="modal-detail-label">Satış Tarihi</div>
        <div id="modalDate" class="modal-detail-value"></div>
      </div>
    </div>

    <button id="closeModal" class="close-button">
      Kapat
    </button>
  </div>
</div>

<!-- BARKOD -->
<div id="scanner" class="scanner">
  <video id="scannerVideo" playsinline></video>

  <div class="scanner-line"></div>

  <button id="scannerClose" class="scanner-close">
    ✕
  </button>
</div>

<script>
/*************************************************
 * TELEGRAM
 *************************************************/

const telegramWebApp =
  window.Telegram &&
  window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;

if (telegramWebApp) {
  telegramWebApp.ready();
  telegramWebApp.expand();
}

/*************************************************
 * API
 *************************************************/

const API_URL =
  "https://script.google.com/macros/s/AKfycbyX6_Tkt8Jv9rrEw-uyqJe3O40ni5vWpMGiFfm_QcllxdyfPuwAs7Y2PwGRQX4h_7-fjQ/exec";

/*************************************************
 * ELEMENTLER
 *************************************************/

const searchInput =
  document.getElementById("searchInput");

const searchButton =
  document.getElementById("searchButton");

const barcodeButton =
  document.getElementById("barcodeButton");

const results =
  document.getElementById("results");

const status =
  document.getElementById("status");

const loadingScreen =
  document.getElementById("loadingScreen");

const loadingTitle =
  document.getElementById("loadingTitle");

const loadingDescription =
  document.getElementById("loadingDescription");

/*************************************************
 * YÜKLENME EKRANI
 *************************************************/

function progressGoster(baslik, aciklama) {
  results.innerHTML = "";

  loadingTitle.textContent = baslik;
  loadingDescription.textContent =
    aciklama || "Lütfen bekleyin.";

  loadingScreen.style.display = "flex";
}

function progressGizle() {
  loadingScreen.style.display = "none";
}

/*************************************************
 * TELEGRAM INIT DATA
 *************************************************/

function getInitData() {
  if (!telegramWebApp) {
    return "";
  }

  return telegramWebApp.initData || "";
}

async function getTelegramInitData() {
  for (let i = 0; i < 20; i++) {
    const initData = getInitData();

    if (initData) {
      return initData;
    }

    await new Promise(function(resolve) {
      setTimeout(resolve, 250);
    });
  }

  return "";
}

/*************************************************
 * YETKİ KONTROL
 *************************************************/

async function miniAppYetkiKontrol() {
  progressGoster(
    "Telegram doğrulanıyor...",
    "Kullanıcı bilgileriniz kontrol ediliyor."
  );

  try {
    const initData = await getTelegramInitData();

    if (!initData) {
      status.textContent =
        "❌ Telegram doğrulaması alınamadı.";

      results.innerHTML = "";
      return false;
    }

    const url =
      API_URL +
      "?func=URUN_ARA" +
      "&initData=" +
      encodeURIComponent(initData) +
      "&query=";

    const response = await fetch(url);
    const data = await response.json();

    if (
      !data ||
      data.success !== true ||
      data.authorized !== true
    ) {
      status.textContent =
        data && data.message
          ? "❌ " + data.message
          : "❌ Kullanım yetkiniz yok.";

      results.innerHTML = "";
      return false;
    }

    status.textContent = "Ürün aramaya hazır.";
    return true;

  } catch (err) {
    console.error("Telegram yetki hatası:", err);

    status.textContent =
      "❌ Sunucu bağlantısı kurulamadı.";

    return false;

  } finally {
    progressGizle();
  }
}

/*************************************************
 * ÜRÜN ARAMA
 *************************************************/

let sonArama = "";

async function searchProducts(force = false) {
  const query =
    String(searchInput.value || "").trim();

  if (!query) {
    return;
  }

  if (!force && query === sonArama) {
    return;
  }

  sonArama = query;
  searchButton.disabled = true;

  progressGoster(
    "Ürünler aranıyor...",
    "Aradığınız ürünler getiriliyor."
  );

  status.textContent = "";

  try {
    const initData = await getTelegramInitData();

    if (!initData) {
      status.textContent =
        "❌ Telegram doğrulaması alınamadı.";

      results.innerHTML = "";
      return;
    }

    const url =
      API_URL +
      "?func=URUN_ARA" +
      "&initData=" +
      encodeURIComponent(initData) +
      "&query=" +
      encodeURIComponent(query);

    const response = await fetch(url);
    const data = await response.json();

    if (!data || data.success !== true) {
      status.textContent =
        data && data.message
          ? "❌ " + data.message
          : "❌ Arama yapılamadı.";

      return;
    }

    if (data.authorized !== true) {
      status.textContent =
        data.message
          ? "❌ " + data.message
          : "❌ Kullanım yetkiniz yok.";

      return;
    }

    renderResults(
      Array.isArray(data.products)
        ? data.products
        : []
    );

  } catch (err) {
    console.error("Ürün arama hatası:", err);

    results.innerHTML =
      '<div class="empty">❌ Bağlantı hatası oluştu.</div>';

    status.textContent = "Bağlantı hatası.";

  } finally {
    progressGizle();
    searchButton.disabled = false;
  }
}

/*************************************************
 * SONUÇLARI GÖSTER
 *************************************************/

let tumUrunler = [];
let gosterilenUrunSayisi = 0;

const ILK_GOSTERIM = 20;
const SONRAKI_GOSTERIM = 10;

function renderResults(data) {
  results.innerHTML = "";

  tumUrunler = Array.isArray(data)
    ? data
    : [];

  gosterilenUrunSayisi = 0;

  if (tumUrunler.length === 0) {
    status.textContent = "❌ Ürün bulunamadı.";

    results.innerHTML =
      '<div class="empty">Ürün bulunamadı.</div>';

    return;
  }

  status.textContent =
    tumUrunler.length + " ürün bulundu.";

  sonrakiUrunleriGoster(ILK_GOSTERIM);
}

function sonrakiUrunleriGoster(adet) {
  const baslangic = gosterilenUrunSayisi;

  const bitis = Math.min(
    gosterilenUrunSayisi + adet,
    tumUrunler.length
  );

  for (let i = baslangic; i < bitis; i++) {
    const urun = tumUrunler[i];

    const card = document.createElement("div");
    card.className = "product-card";

    const img = document.createElement("img");
    img.className = "product-image";
    img.alt = urun.kod || "Ürün";

    if (urun.link) {
      img.src = urun.link;
    } else {
      img.style.visibility = "hidden";
    }

    const info = document.createElement("div");
    info.className = "product-info";

    const name = document.createElement("div");
    name.className = "product-name";
    name.textContent = urun.kod || "Ürün";

    const code = document.createElement("div");
    code.className = "product-code";
    code.textContent = "🔢 Kod: " + (urun.urunKodu || "");

    const price = document.createElement("div");
    price.className = "product-price";
    price.textContent = "💰 Fiyat: " + (urun.fiyat || "");

    const date = document.createElement("div");
    date.className = "product-date";
    date.textContent = "📅 Satış Tarihi: " + (urun.tarih || "");

    info.appendChild(name);
    info.appendChild(code);
    info.appendChild(price);
    info.appendChild(date);

    card.appendChild(img);
    card.appendChild(info);

    card.addEventListener("click", function() {
      showProductDetail(urun);
    });

    results.appendChild(card);
  }

  gosterilenUrunSayisi = bitis;

  status.textContent =
    gosterilenUrunSayisi +
    " / " +
    tumUrunler.length +
    " ürün gösteriliyor.";
}

/*************************************************
 * ÜRÜN DETAY PENCERESİ
 *************************************************/

function showProductDetail(urun) {
  const modal = document.getElementById("productModal");
  const modalImage = document.getElementById("modalImage");

  document.getElementById("modalTitle").textContent =
    urun.kod || "Ürün";

  document.getElementById("modalPrice").textContent =
    urun.fiyat || "";

  document.getElementById("modalCode").textContent =
    urun.urunKodu || "";

  document.getElementById("modalDate").textContent =
    urun.tarih || "";

  if (urun.link) {
    modalImage.src = urun.link;
    modalImage.style.display = "block";
  } else {
    modalImage.removeAttribute("src");
    modalImage.style.display = "none";
  }

  const qr = document.getElementById("qrCode");
  qr.innerHTML = "";

  if (typeof QRCode !== "undefined" && urun.urunKodu) {
    new QRCode(qr, {
      text: String(urun.urunKodu),
      width: 132,
      height: 132,
      correctLevel: QRCode.CorrectLevel.M
    });
  } else {
    qr.textContent = "QR kod oluşturulamadı.";
  }

  modal.style.display = "flex";
}

/*************************************************
 * HTML GÜVENLİ
 *************************************************/

function escapeHtml(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

/*************************************************
 * MODAL KAPAT
 *************************************************/

document
  .getElementById("closeModal")
  .addEventListener("click", function() {
    document.getElementById("productModal").style.display = "none";
  });

document
  .getElementById("productModal")
  .addEventListener("click", function(e) {
    if (e.target === this) {
      this.style.display = "none";
    }
  });

/*************************************************
 * ARAMA BUTONU
 *************************************************/

searchButton.addEventListener("click", function() {
  searchProducts(true);
});

/*************************************************
 * ENTER TUŞU
 *************************************************/

searchInput.addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    e.preventDefault();
    searchProducts(true);
  }
});

/*************************************************
 * KLAVYE KAPANINCA ARA
 *************************************************/

let keyboardWasOpen = false;

if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", function() {
    const height = window.visualViewport.height;
    const windowHeight = window.innerHeight;

    const keyboardOpen =
      windowHeight - height > 150;

    if (keyboardOpen) {
      keyboardWasOpen = true;

    } else if (keyboardWasOpen) {
      keyboardWasOpen = false;

      if (searchInput.value.trim()) {
        searchProducts(true);
      }
    }
  });
}

/*************************************************
 * BARKOD TARAYICI
 *************************************************/

let codeReader = null;
let scannerControls = null;

async function startScanner() {
  const scanner = document.getElementById("scanner");
  const video = document.getElementById("scannerVideo");

  scanner.style.display = "block";

  try {
    codeReader =
      new ZXingBrowser.BrowserMultiFormatReader();

    scannerControls =
      await codeReader.decodeFromVideoDevice(
        undefined,
        video,
        function(result, error) {
          if (result) {
            const barkod = result.getText();

            stopScanner();

            searchInput.value = barkod;
            searchProducts(true);
          }
        }
      );

  } catch (err) {
    console.error(err);
    alert("Kamera açılamadı.");
    stopScanner();
  }
}

/*************************************************
 * SCANNER DURDUR
 *************************************************/

function stopScanner() {
  if (scannerControls) {
    try {
      scannerControls.stop();
    } catch (e) {}

    scannerControls = null;
  }

  if (codeReader) {
    try {
      codeReader.reset();
    } catch (e) {}

    codeReader = null;
  }

  document.getElementById("scanner").style.display = "none";
}

/*************************************************
 * BARKOD BUTONU
 *************************************************/

barcodeButton.addEventListener("click", function() {
  startScanner();
});

/*************************************************
 * SCANNER KAPAT
 *************************************************/

document
  .getElementById("scannerClose")
  .addEventListener("click", function() {
    stopScanner();
  });

/*************************************************
 * TELEGRAM GERİ BUTONU
 *************************************************/

if (telegramWebApp) {
  telegramWebApp.BackButton.onClick(function() {
    const modal = document.getElementById("productModal");
    const scanner = document.getElementById("scanner");

    if (scanner.style.display === "block") {
      stopScanner();
      return;
    }

    if (modal.style.display === "flex") {
      modal.style.display = "none";
      return;
    }

    telegramWebApp.close();
  });
}

/*************************************************
 * BAŞLANGIÇ
 *************************************************/

document.addEventListener("DOMContentLoaded", async function() {
  if (!telegramWebApp) {
    status.textContent =
      "❌ Bu uygulama Telegram içinden açılmalıdır.";

    return;
  }

  telegramWebApp.ready();
  telegramWebApp.expand();

  await miniAppYetkiKontrol();
});

/*************************************************
 * SAYFA SONUNA GELİNCE DAHA FAZLA ÜRÜN GÖSTER
 *************************************************/

window.addEventListener("scroll", function() {
  const scrollPosition =
    window.innerHeight + window.scrollY;

  const documentHeight =
    document.documentElement.scrollHeight;

  if (scrollPosition >= documentHeight - 300) {
    if (gosterilenUrunSayisi < tumUrunler.length) {
      sonrakiUrunleriGoster(SONRAKI_GOSTERIM);
    }
  }
});
</script>

</body>
</html>
