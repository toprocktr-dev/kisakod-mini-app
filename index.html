<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>KısaKod PLUS</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- iOS + Android barkod okuyucu -->
<script src="https://unpkg.com/@zxing/browser@0.2.1"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

.container {
    padding: 10px;
    max-width: 700px;
    margin: auto;
}

/* =========================================================
   ARAMA ALANI
========================================================= */

.search-box {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
}

#searchInput {
    flex: 1;
    min-width: 0;
    height: 46px;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 0 12px;
    font-size: 16px;
    outline: none;
    background: white;
}

#searchButton,
#scanButton {
    border: none;
    border-radius: 10px;
    height: 46px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

#searchButton {
    background: #0088cc;
    color: white;
    padding: 0 14px;
}

#scanButton {
    background: #222;
    color: white;
    width: 48px;
    padding: 0;
    font-size: 20px;
}

/* =========================================================
   HATA
========================================================= */

#errorBox {
    display: none;
    background: #ffecec;
    color: #c00;
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 10px;
    font-size: 14px;
}

/* =========================================================
   SONUÇLAR
========================================================= */

#results {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

/* =========================================================
   YATAY ÜRÜN KARTI
========================================================= */

.product-card {
    display: flex;
    align-items: center;

    background: white;

    border-radius: 10px;

    padding: 7px;

    min-height: 105px;

    box-shadow: 0 1px 4px rgba(0,0,0,0.08);

    cursor: pointer;
}

/* Küçük ürün resmi */

.product-image {
    width: 90px;
    height: 90px;

    flex-shrink: 0;

    object-fit: contain;

    border-radius: 8px;

    background: #fafafa;

    display: block;

    margin-right: 10px;
}

/* Ürün bilgileri */

.product-info-area {
    flex: 1;
    min-width: 0;
}

/* Ürün adı */

.product-name {
    font-size: 15px;
    font-weight: bold;

    line-height: 1.25;

    margin-bottom: 5px;

    word-break: break-word;
}

/* Ürün detay bilgileri */

.product-info {
    font-size: 13px;
    line-height: 1.45;
}

/* Kart ayırıcı */

.separator {
    border-top: 1px solid #e5e5e5;
    margin-top: 6px;
}

/* =========================================================
   YÜKLENİYOR
========================================================= */

.loading {
    text-align: center;
    padding: 20px;
    color: #777;
}

.no-result {
    text-align: center;
    padding: 25px;
    color: #777;
}

/* =========================================================
   KAMERA
========================================================= */

#scannerOverlay {
    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,0.94);

    z-index: 9999;

    align-items: center;

    justify-content: center;

    flex-direction: column;
}

#scannerOverlay.show {
    display: flex;
}

#scannerVideo {
    width: 92%;
    max-width: 500px;
    max-height: 70vh;

    object-fit: cover;

    border-radius: 15px;

    background: black;
}

.scanner-frame {
    position: absolute;

    width: 70%;

    max-width: 350px;

    height: 150px;

    border: 3px solid #00ff66;

    border-radius: 15px;

    pointer-events: none;
}

.scanner-text {
    color: white;

    margin-top: 20px;

    font-size: 15px;

    text-align: center;

    padding: 0 20px;
}

#closeScannerButton {
    margin-top: 20px;

    border: none;

    border-radius: 12px;

    padding: 13px 25px;

    background: white;

    color: black;

    font-size: 16px;

    font-weight: bold;
}

/* =========================================================
   ÜRÜN DETAY MODALI
========================================================= */

#productModal {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 10000;

    background: rgba(0,0,0,0.7);

    align-items: center;

    justify-content: center;

    padding: 15px;
}

#productModal.show {
    display: flex;
}

.modal-content {
    background: white;

    width: 100%;

    max-width: 500px;

    max-height: 90vh;

    overflow-y: auto;

    border-radius: 16px;

    padding: 15px;

    position: relative;
}

.modal-close {
    position: absolute;

    right: 12px;

    top: 8px;

    border: none;

    background: #eee;

    width: 35px;

    height: 35px;

    border-radius: 50%;

    font-size: 20px;
}

.modal-image {
    width: 100%;

    max-height: 300px;

    object-fit: contain;

    border-radius: 10px;

    margin-bottom: 12px;
}

.modal-title {
    font-size: 19px;

    font-weight: bold;

    margin-bottom: 10px;
}

.modal-info {
    font-size: 15px;

    line-height: 1.7;
}

</style>

</head>

<body>


<div class="container">

    <!-- HATA -->

    <div id="errorBox"></div>


    <!-- =====================================================
         ARAMA ALANI
    ====================================================== -->

    <div class="search-box">

        <input
            id="searchInput"
            type="search"
            placeholder="Ürün veya barkod ara..."
            autocomplete="off"
            autocorrect="off"
            autocapitalize="none"
            spellcheck="false"
        >

        <button id="searchButton">
            Ara
        </button>

        <button id="scanButton">
            📷
        </button>

    </div>


    <!-- =====================================================
         SONUÇLAR
    ====================================================== -->

    <div id="results"></div>

</div>


<!-- =========================================================
     BARKOD OKUYUCU
========================================================= -->

<div id="scannerOverlay">

    <video
        id="scannerVideo"
        autoplay
        muted
        playsinline
    ></video>

    <div class="scanner-frame"></div>

    <div class="scanner-text">
        Barkodu yeşil alanın içine getiriniz
    </div>

    <button id="closeScannerButton">
        Kapat
    </button>

</div>


<!-- =========================================================
     ÜRÜN DETAY
========================================================= -->

<div id="productModal">

    <div class="modal-content">

        <button
            class="modal-close"
            id="modalClose">
            ×
        </button>

        <div id="modalBody"></div>

    </div>

</div>


<script>

/* =========================================================
   TELEGRAM WEB APP
========================================================= */

const telegramWebApp =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;


if (telegramWebApp) {

    telegramWebApp.ready();

    telegramWebApp.expand();

}


/* =========================================================
   API
========================================================= */

/*
   BURAYA MEVCUT APPS SCRIPT /exec ADRESİNİ AYNEN KOY.
*/

const API_URL =
    "https://script.google.com/macros/s/AKfycbz1_C6Tf3Tqyww60D9DwbeUMBENI_gTiewTzbzLxV2ZUWCxZosSug3Kl6JLP_EIl3erIw/exec";


/* =========================================================
   DEĞİŞKENLER
========================================================= */

let miniAppAuthorized = false;

let lastSearch = "";

let currentResults = [];


/* =========================================================
   BARKOD OKUYUCU DEĞİŞKENLERİ
========================================================= */

let barcodeReader = null;

let scannerControls = null;

let scannerRunning = false;


/* =========================================================
   ELEMENTLER
========================================================= */

const searchInput =
    document.getElementById("searchInput");

const searchButton =
    document.getElementById("searchButton");

const scanButton =
    document.getElementById("scanButton");

const resultsDiv =
    document.getElementById("results");

const errorBox =
    document.getElementById("errorBox");

const scannerOverlay =
    document.getElementById("scannerOverlay");

const scannerVideo =
    document.getElementById("scannerVideo");

const closeScannerButton =
    document.getElementById("closeScannerButton");

const productModal =
    document.getElementById("productModal");

const modalBody =
    document.getElementById("modalBody");

const modalClose =
    document.getElementById("modalClose");


/* =========================================================
   TELEGRAM INIT DATA
========================================================= */

function getInitData() {

    if (!telegramWebApp) {
        return "";
    }

    return telegramWebApp.initData || "";

}


/* =========================================================
   HATA GÖSTER
========================================================= */

function showError(message) {

    errorBox.textContent = message;

    errorBox.style.display = "block";

}


function hideError() {

    errorBox.textContent = "";

    errorBox.style.display = "none";

}


/* =========================================================
   TÜRKÇE NORMALİZASYON
========================================================= */

function normalizeText(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }

    return String(value)
        .toLowerCase()
        .replace(/İ/g, "i")
        .replace(/I/g, "ı")
        .replace(/Ğ/g, "ğ")
        .replace(/Ü/g, "ü")
        .replace(/Ş/g, "ş")
        .replace(/Ö/g, "ö")
        .replace(/Ç/g, "ç")
        .replace(/\s+/g, " ")
        .trim();

}


/* =========================================================
   BARKOD NORMALİZASYON
========================================================= */

function normalizeBarcode(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }

    return String(value)
        .replace(/\D/g, "")
        .trim();

}


/* =========================================================
   ROW DÖNÜŞTÜR
========================================================= */

function convertRow(row) {

    return {

        urunKodu:
            row && row.length > 0
                ? row[0]
                : "",

        kod:
            row && row.length > 1
                ? row[1]
                : "",

        fiyat:
            row && row.length > 2
                ? row[2]
                : "",

        tarih:
            row && row.length > 3
                ? row[3]
                : "",

        link:
            row && row.length > 4
                ? row[4]
                : "",

        barkod:
            row && row.length > 5
                ? row[5]
                : ""

    };

}


/* =========================================================
   MINI APP YETKİ KONTROLÜ
========================================================= */

async function miniAppYetkiKontrol() {

    try {

        if (!telegramWebApp) {

            showError(
                "Telegram Mini App üzerinden açılmalıdır."
            );

            return false;

        }


        const initData =
            getInitData();


        if (!initData) {

            showError(
                "Telegram kullanıcı bilgisi alınamadı."
            );

            return false;

        }


        const url =
            API_URL +
            "?func=URUN_ARA" +
            "&query=" +
            "&initData=" +
            encodeURIComponent(initData);


        const response =
            await fetch(
                url,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }


        const data =
            await response.json();


        if (
            data &&
            data.ok === false &&
            data.yetkili === false
        ) {

            showError(
                data.hata ||
                "Mini App kullanım yetkiniz bulunmuyor."
            );

            return false;

        }


        miniAppAuthorized = true;

        hideError();

        return true;

    }
    catch (error) {

        console.error(
            "Yetki kontrol hatası:",
            error
        );

        showError(
            "Bağlantı sırasında hata oluştu."
        );

        return false;

    }

}


/* =========================================================
   ÜRÜN ARAMA
   SADECE:
   - ARA BUTONU
   - ENTER
   - BARKOD OKUMA
   İLE ÇALIŞIR.
========================================================= */

async function searchProducts(query) {

    query =
        String(query || "").trim();


    if (!query) {

        resultsDiv.innerHTML = "";

        return;

    }


    if (!miniAppAuthorized) {

        const authorized =
            await miniAppYetkiKontrol();


        if (!authorized) {
            return;
        }

    }


    hideError();


    resultsDiv.innerHTML =
        '<div class="loading">Ürünler aranıyor...</div>';


    lastSearch =
        query;


    try {

        const initData =
            getInitData();


        if (!initData) {

            showError(
                "Telegram kullanıcı bilgisi alınamadı."
            );

            resultsDiv.innerHTML = "";

            return;

        }


        const url =
            API_URL +
            "?func=URUN_ARA" +
            "&query=" +
            encodeURIComponent(query) +
            "&initData=" +
            encodeURIComponent(initData);


        const response =
            await fetch(
                url,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }


        const data =
            await response.json();


        /*
           API yetki reddi
        */

        if (
            data &&
            data.ok === false
        ) {

            if (
                data.yetkili === false
            ) {

                miniAppAuthorized =
                    false;

            }


            showError(
                data.hata ||
                "Arama yapılamadı."
            );


            resultsDiv.innerHTML = "";

            return;

        }


        /*
           API normalde direkt array döndürüyor.
        */

        if (!Array.isArray(data)) {

            resultsDiv.innerHTML = "";

            showError(
                "Geçersiz ürün verisi."
            );

            return;

        }


        let products =
            data.map(convertRow);


        /*
           Barkod tarandıysa
           tam barkod eşleşmesini öne çıkar.
        */

        const normalizedBarcode =
            normalizeBarcode(query);


        if (
            normalizedBarcode &&
            normalizedBarcode.length >= 6
        ) {

            const exactBarcode =
                products.filter(
                    function(product) {

                        return normalizeBarcode(
                            product.barkod
                        ) === normalizedBarcode;

                    }
                );


            if (
                exactBarcode.length > 0
            ) {

                products =
                    exactBarcode;

            }

        }


        currentResults =
            products;


        renderResults(
            products
        );

    }
    catch (error) {

        console.error(
            "Arama hatası:",
            error
        );


        resultsDiv.innerHTML = "";


        showError(
            "Ürün aranırken bir hata oluştu."
        );

    }

}


/* =========================================================
   SONUÇLARI GÖSTER
========================================================= */

function renderResults(products) {

    if (
        !products ||
        products.length === 0
    ) {

        resultsDiv.innerHTML =
            '<div class="no-result">' +
            'Ürün bulunamadı.' +
            '</div>';

        return;

    }


    resultsDiv.innerHTML = "";


    products.forEach(
        function(product) {

            const card =
                document.createElement("div");


            card.className =
                "product-card";


            /*
               Küçük ürün görseli
            */

            if (product.link) {

                const image =
                    document.createElement("img");


                image.className =
                    "product-image";


                image.src =
                    product.link;


                image.alt =
                    product.kod ||
                    "Ürün";


                image.loading =
                    "lazy";


                image.onerror =
                    function() {

                        this.style.display =
                            "none";

                    };


                card.appendChild(
                    image
                );

            }


            /*
               Sağdaki bilgi alanı
            */

            const infoArea =
                document.createElement("div");


            infoArea.className =
                "product-info-area";


            /*
               Ürün adı
            */

            const name =
                document.createElement("div");


            name.className =
                "product-name";


            name.textContent =
                product.kod ||
                product.urunKodu ||
                "Ürün";


            infoArea.appendChild(
                name
            );


            /*
               Ürün bilgileri
            */

            const info =
                document.createElement("div");


            info.className =
                "product-info";


            info.innerHTML =
                "🔢 Kod: " +
                escapeHtml(
                    product.urunKodu
                ) +
                "<br>" +

                "💰 Fiyat: " +
                escapeHtml(
                    product.fiyat
                ) +
                "<br>" +

                "📅 Satış Tarihi: " +
                escapeHtml(
                    product.tarih
                );


            infoArea.appendChild(
                info
            );


            card.appendChild(
                infoArea
            );


            /*
               Ürün detayına tıklama
            */

            card.addEventListener(
                "click",
                function() {

                    showProductDetail(
                        product
                    );

                }
            );


            resultsDiv.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   ÜRÜN DETAY
========================================================= */

function showProductDetail(product) {

    let html = "";


    if (product.link) {

        html +=
            '<img class="modal-image" src="' +
            escapeHtml(
                product.link
            ) +
            '" onerror="this.style.display=\'none\'">';

    }


    html +=
        '<div class="modal-title">' +

        escapeHtml(
            product.kod ||
            product.urunKodu ||
            "Ürün"
        ) +

        '</div>';


    html +=
        '<div class="modal-info">' +

        "🔢 Kod: " +

        escapeHtml(
            product.urunKodu
        ) +

        "<br>" +

        "💰 Fiyat: " +

        escapeHtml(
            product.fiyat
        ) +

        "<br>" +

        "📅 Satış Tarihi: " +

        escapeHtml(
            product.tarih
        ) +

        "</div>";


    /*
       Barkod özellikle gösterilmiyor.
    */


    modalBody.innerHTML =
        html;


    productModal.classList.add(
        "show"
    );

}


function closeProductDetail() {

    productModal.classList.remove(
        "show"
    );

}


/* =========================================================
   ARA BUTONU
========================================================= */

searchButton.addEventListener(
    "click",
    function() {

        searchProducts(
            searchInput.value
        );

    }
);


/* =========================================================
   ENTER İLE ARAMA
========================================================= */

searchInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            searchProducts(
                searchInput.value
            );

        }

    }
);


/* =========================================================
   ÖNEMLİ:
   YAZARKEN OTOMATİK ARAMA YOK.
   
   Burada input event'i özellikle
   kullanılmıyor.
========================================================= */


/* =========================================================
   ZXING KAMERA BAŞLAT
========================================================= */

async function startScanner() {

    /*
       Kamera sadece kullanıcı
       📷 butonuna bastığında başlatılır.
    */


    if (!miniAppAuthorized) {

        const authorized =
            await miniAppYetkiKontrol();


        if (!authorized) {
            return;
        }

    }


    try {

        hideError();


        /*
           ZXing yüklendi mi?
        */

        if (
            typeof ZXingBrowser ===
            "undefined"
        ) {

            throw new Error(
                "Barkod okuyucu kütüphanesi yüklenemedi."
            );

        }


        /*
           Önce eski kamerayı kapat.
        */

        stopScanner();


        /*
           Okuyucuyu oluştur.
        */

        barcodeReader =
            new ZXingBrowser.BrowserMultiFormatReader();


        /*
           Kamera ekranını aç.
        */

        scannerOverlay.classList.add(
            "show"
        );


        scannerRunning =
            true;


        scannerVideo.setAttribute(
            "playsinline",
            ""
        );


        scannerVideo.setAttribute(
            "autoplay",
            ""
        );


        scannerVideo.setAttribute(
            "muted",
            ""
        );


        /*
           Kamera başlat.
        */

        scannerControls =
            await barcodeReader.decodeFromVideoDevice(

                undefined,

                scannerVideo,

                function(result, error) {

                    if (
                        !scannerRunning
                    ) {

                        return;

                    }


                    /*
                       Barkod bulundu.
                    */

                    if (result) {

                        const barcode =
                            result.getText();


                        if (!barcode) {

                            return;

                        }


                        /*
                           Aynı barkodun
                           tekrar okunmasını engelle.
                        */

                        scannerRunning =
                            false;


                        stopScanner();


                        /*
                           Barkodu arama kutusuna yaz.
                        */

                        searchInput.value =
                            barcode;


                        /*
                           Barkod okunduğunda
                           otomatik arama yapılır.
                        */

                        searchProducts(
                            barcode
                        );

                    }

                }

            );

    }
    catch (error) {

        console.error(
            "Scanner error:",
            error
        );


        stopScanner();


        let message =
            "Kamera açılamadı.";


        if (
            error &&
            error.name ===
            "NotAllowedError"
        ) {

            message =
                "Kamera izni verilmedi. " +
                "Telegram'ın kamera iznini kontrol edin.";

        }
        else if (
            error &&
            error.name ===
            "NotFoundError"
        ) {

            message =
                "Kamera bulunamadı.";

        }
        else if (
            error &&
            error.name ===
            "NotReadableError"
        ) {

            message =
                "Kamera başka bir uygulama tarafından kullanılıyor.";

        }


        alert(
            message
        );

    }

}


/* =========================================================
   SCANNER DURDUR
========================================================= */

function stopScanner() {

    scannerRunning =
        false;


    /*
       ZXing controls.stop()
    */

    if (scannerControls) {

        try {

            scannerControls.stop();

        }
        catch (error) {

            console.log(
                "Scanner stop:",
                error
            );

        }


        scannerControls =
            null;

    }


    /*
       Video stream'i kapat.
    */

    try {

        if (
            scannerVideo &&
            scannerVideo.srcObject
        ) {

            const stream =
                scannerVideo.srcObject;


            if (
                stream &&
                stream.getTracks
            ) {

                stream
                    .getTracks()
                    .forEach(
                        function(track) {

                            track.stop();

                        }
                    );

            }


            scannerVideo.srcObject =
                null;

        }

    }
    catch (error) {

        console.log(
            "Video stop:",
            error
        );

    }


    scannerOverlay.classList.remove(
        "show"
    );

}


/* =========================================================
   KAMERA BUTONU
========================================================= */

scanButton.addEventListener(
    "click",
    function() {

        startScanner();

    }
);


/* =========================================================
   KAMERA KAPAT
========================================================= */

closeScannerButton.addEventListener(
    "click",
    function() {

        stopScanner();

    }
);


/* =========================================================
   MODAL KAPAT
========================================================= */

modalClose.addEventListener(
    "click",
    function() {

        closeProductDetail();

    }
);


productModal.addEventListener(
    "click",
    function(event) {

        if (
            event.target ===
            productModal
        ) {

            closeProductDetail();

        }

    }
);


/* =========================================================
   TELEGRAM BACK BUTTON
========================================================= */

if (telegramWebApp) {

    try {

        telegramWebApp.BackButton.onClick(
            function() {

                if (
                    productModal.classList.contains(
                        "show"
                    )
                ) {

                    closeProductDetail();

                    return;

                }


                if (
                    scannerOverlay.classList.contains(
                        "show"
                    )
                ) {

                    stopScanner();

                    return;

                }

            }
        );

    }
    catch (error) {

        console.log(
            "Telegram BackButton:",
            error
        );

    }

}


/* =========================================================
   SAYFA KAPANIRKEN KAMERAYI KAPAT
========================================================= */

window.addEventListener(
    "pagehide",
    function() {

        stopScanner();

    }
);


window.addEventListener(
    "beforeunload",
    function() {

        stopScanner();

    }
);


/* =========================================================
   MINI APP BAŞLANGIÇ
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    async function() {

        /*
           Burada SADECE yetki kontrolü yapılır.
           
           ÜRÜN ARAMASI YAPILMAZ.
           
           Kamera da başlatılmaz.
        */

        const authorized =
            await miniAppYetkiKontrol();


        if (!authorized) {

            return;

        }


        /*
           Yetki başarılı.
           Kullanıcı isterse yazıp
           ARA butonuna basar.
        */

        searchInput.focus();

    }
);

</script>
