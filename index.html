<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KısaKod PLUS</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/@zxing/browser@0.2.1"></script>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #f4f5f7;
  font-family: Arial, sans-serif;
}

body {
  overflow-x: hidden;
}

.header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: #fff;
  padding: 12px;
  border-bottom: 1px solid #ddd;
}

.title {
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 10px;
}

.search-row {
  display: flex;
  gap: 7px;
}

.search-input {
  flex: 1;
  min-width: 0;
  height: 45px;
  border: 1px solid #ccc;
  border-radius: 10px;
  padding: 0 12px;
  font-size: 16px;
  outline: none;
  background: #fff;
}

.search-input:focus {
  border-color: #777;
}

.search-button {
  width: 70px;
  height: 45px;
  border: 0;
  border-radius: 10px;
  background: #111;
  color: white;
  font-size: 15px;
  font-weight: bold;
}

.barcode-button {
  width: 48px;
  height: 45px;
  border: 0;
  border-radius: 10px;
  background: #e9eaed;
  font-size: 22px;
}

.search-button:active,
.barcode-button:active {
  transform: scale(.96);
}

.status {
  text-align: center;
  padding: 12px;
  font-size: 14px;
  color: #666;
}

.results {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 8px 10px 20px;
}

.product-card {
  width: 100%;
  background: #fff;
  border-radius: 12px;
  padding: 9px;
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid #e3e3e3;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
}

.product-image {
  width: 90px;
  height: 90px;
  min-width: 90px;
  border-radius: 9px;
  object-fit: cover;
  background: #eee;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  pointer-events: none;
}

.product-info {
  flex: 1;
  min-width: 0;
}

.product-favorite-button {
   flex: 0 0 34px;
   width: 34px;
   height: 38px;
   padding: 0;
   border: 0;
   border-radius: 9px;
   background: #f5f5f5;
   color: #777;
   font-size: 23px;
   display: flex;
   align-items: center;
   justify-content: center;
}

.product-favorite-button.is-favorite {
   background: #fff4d6;
   color: #d49a00;
}

.product-name {
  font-size: 15px;
  font-weight: bold;
  line-height: 1.25;
  margin-bottom: 7px;
  word-break: break-word;
}

.product-code {
  font-size: 13px;
  color: #555;
  margin-bottom: 4px;
}

.product-price {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 4px;
}

.product-date {
  font-size: 13px;
  color: #666;
}

.empty {
  text-align: center;
  padding: 35px 15px;
  color: #777;
  font-size: 15px;
}

.loading {
  text-align: center;
  padding: 25px;
  color: #666;
}

/* ÖZEL YÜKLENME EKRANI */
.loading-screen {
  position: fixed;
  inset: 0;
  z-index: 500;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(244,245,247,.96);
}

.loading-box {
  width: 100%;
  max-width: 320px;
  padding: 30px 20px;
  text-align: center;
  background: #fff;
  border: 1px solid #e5e9f0;
  border-radius: 22px;
  box-shadow: 0 12px 40px rgba(0,0,0,.10);
}

.custom-spinner {
  width: 64px;
  height: 64px;
  margin: 0 auto 20px;
  border: 6px solid #e5edff;
  border-top-color: #2468df;
  border-right-color: #2468df;
  border-radius: 50%;
  animation: kisakodSpin .8s linear infinite;
}

@keyframes kisakodSpin {
  to {
    transform: rotate(360deg);
  }
}

.loading-title {
  font-size: 18px;
  font-weight: bold;
  line-height: 1.4;
  color: #202938;
}

.loading-description {
  margin-top: 9px;
  color: #778196;
  font-size: 13px;
}

/* ÜRÜN DETAY PENCERESİ */
.modal {
  display: none;
  position: fixed;
  z-index: 100;
  inset: 0;
  background: rgba(0,0,0,.55);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-box {
  position: relative;
  width: 100%;
  max-width: 420px;
  background: white;
  border-radius: 20px;
  padding: 20px;
  max-height: 90vh;
  overflow-y: auto;
}

.modal-image {
  display: block;
  width: 100%;
  height: 190px;
  object-fit: contain;
  border-radius: 12px;
  background: #fff;
  margin: 0 auto 12px;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  pointer-events: none;
}

.modal-title {
  font-size: 18px;
  font-weight: 800;
  line-height: 1.4;
  text-align: center;
  margin: 8px 0 15px;
  color: #202938;
}

.modal-qr {
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 12px 0 17px;
}

#qrCode {
  min-width: 148px;
  min-height: 148px;
  padding: 8px;
  background: white;
  border: 1px solid #e6eaf0;
  border-radius: 12px;
}

#qrCode img,
#qrCode canvas {
  display: block;
  width: 132px !important;
  height: 132px !important;
}

.modal-price {
  padding: 12px;
  margin: 0 0 16px;
  border-radius: 12px;
  text-align: center;
  background: #fff0f0;
  color: #cf3434;
  font-size: 28px;
  font-weight: 900;
}

.modal-details {
  display: grid;
  grid-template-columns: 1fr 1.35fr;
  gap: 12px;
  align-items: start;
}

.modal-detail-item {
  min-width: 0;
}

.modal-detail-item + .modal-detail-item {
  border-left: 1px solid #e1e5ec;
  padding-left: 12px;
}

.modal-detail-label {
  font-size: 12px;
  color: #788397;
  margin-bottom: 6px;
}

.modal-detail-value {
  font-size: 15px;
  font-weight: 800;
  color: #202938;
  overflow-wrap: anywhere;
}

.detail-favorite-button {
   width: 100%;
   margin-top: 15px;
   min-height: 43px;
   border: 1px solid #ead9a7;
   border-radius: 10px;
   background: #fff8e6;
   color: #765900;
   font-size: 15px;
   font-weight: bold;
}

.favorites-empty {
   text-align: center;
   padding: 28px 15px;
   color: #777;
   font-size: 14px;
   line-height: 1.6;
   background: #fff;
   border: 1px solid #e3e3e3;
   border-radius: 12px;
}

.close-button {
  width: 100%;
  margin-top: 15px;
  height: 43px;
  border: 0;
  border-radius: 10px;
  background: #111;
  color: white;
  font-size: 15px;
}

@media (max-width: 360px) {
  .modal-box {
    padding: 16px;
  }

  .modal-price {
    font-size: 25px;
  }

  .modal-detail-value {
    font-size: 13px;
  }
}

/* BARKOD TARAYICI */
.scanner {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 200;
  background: #000;
}

.scanner video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.scanner-close {
  position: absolute;
  z-index: 201;
  top: 20px;
  right: 15px;
  width: 45px;
  height: 45px;
  border: 0;
  border-radius: 50%;
  background: rgba(255,255,255,.9);
  font-size: 22px;
}

.scanner-line {
  position: absolute;
  left: 10%;
  right: 10%;
  top: 50%;
  height: 2px;
  background: red;
}
</style>
</head>

<body>

<div class="header">
  <div class="title">
    🔎 KısaKod PLUS <span class="version-tag">v.1</span>
  </div>

  <div class="search-row">
    <input
      id="searchInput"
      class="search-input"
      type="search"
      placeholder="Ürün adı, kod veya barkod"
      autocomplete="off"
      autocorrect="off"
      spellcheck="false"
    >

    <button
      id="searchButton"
      class="search-button"
    >
      Ara
    </button>

    <button
      id="barcodeButton"
      class="barcode-button"
    >
      📷
    </button>

    <button
      id="favoriteButton"
      class="favorite-button"
      type="button"
      aria-label="Favori ürünler"
      title="Favori ürünler"
    >
      ⭐<span id="favoriteCount" class="favorite-count">0</span>
    </button>
  </div>
</div>

<div id="status" class="status">
  Hazırlanıyor...
</div>

<div id="results" class="results"></div>

<!-- ÖZEL YÜKLENME EKRANI -->
<div id="loadingScreen" class="loading-screen">
  <div class="loading-box">
    <div class="custom-spinner"></div>
    <div id="loadingTitle" class="loading-title">
      Telegram doğrulanıyor...
    </div>
    <div id="loadingDescription" class="loading-description">
      Lütfen bekleyin.
    </div>
  </div>
</div>

<!-- ÜRÜN DETAY -->
<div id="productModal" class="modal">
  <div class="modal-box">
    <img
      id="modalImage"
      class="modal-image"
      src=""
      alt="Ürün görseli"
    >

    <div id="modalTitle" class="modal-title"></div>

    <div class="modal-qr">
      <div id="qrCode"></div>
    </div>

    <div id="modalPrice" class="modal-price"></div>

    <div class="modal-details">
      <div class="modal-detail-item">
        <div class="modal-detail-label">Ürün Kodu</div>
        <div id="modalCode" class="modal-detail-value"></div>
      </div>

      <div class="modal-detail-item">
        <div class="modal-detail-label">Satış Tarihi</div>
        <div id="modalDate" class="modal-detail-value"></div>
      </div>
    </div>

    <button id="detailFavoriteButton" class="detail-favorite-button" type="button">
      ☆ Favorilere ekle
    </button>

    <button id="closeModal" class="close-button">
      Kapat
    </button>
  </div>
</div>

<!-- FAVORİ ÜRÜNLER PENCERESİ -->
<div id="favoritesModal" class="modal">
  <div class="modal-box">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;">
      <div style="font-size:18px;font-weight:800;color:#202938;">⭐ Favori Ürünlerim</div>
      <button id="closeFavorites" type="button" aria-label="Favorileri kapat" style="width:36px;height:36px;border:0;border-radius:50%;background:#f0f1f3;font-size:22px;">×</button>
    </div>
    <div id="favoritesStatus" style="font-size:13px;color:#788397;margin-bottom:12px;"></div>
    <div id="favoritesResults" class="results" style="padding:0;gap:8px;"></div>
  </div>
</div>

<!-- BARKOD -->
<div id="scanner" class="scanner">
  <video id="scannerVideo" playsinline></video>

  <div class="scanner-line"></div>

  <button id="scannerClose" class="scanner-close">
    ✕
  </button>
</div>

<script>
/*************************************************
 * TELEGRAM
 *************************************************/

const telegramWebApp =
  window.Telegram &&
  window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;

if (telegramWebApp) {
  telegramWebApp.ready();
  telegramWebApp.expand();
}

/*************************************************
 * API
 *************************************************/

const API_URL =
  "https://script.google.com/macros/s/AKfycbyYFqpu1NwqmdukfC0O5FIgcJkNa7y1DmbOTMcszHpNXnbNs4LXsXNf90QPJRi_TdAuVA/exec";

/*************************************************
 * ELEMENTLER
 *************************************************/

const searchInput =
  document.getElementById("searchInput");

const searchButton =
  document.getElementById("searchButton");

const barcodeButton =
  document.getElementById("barcodeButton");

const favoriteButton =
  document.getElementById("favoriteButton");

const favoriteCount =
  document.getElementById("favoriteCount");

const favoritesModal =
  document.getElementById("favoritesModal");

const favoritesResults =
  document.getElementById("favoritesResults");

const favoritesStatus =
  document.getElementById("favoritesStatus");

const detailFavoriteButton =
  document.getElementById("detailFavoriteButton");

let seciliUrun = null;
const FAVORITES_STORAGE_KEY = "kisakod_plus_favorites_v1";
let favoriUrunler = favorileriYukle();

function favorileriYukle() {
  try {
    const kayit = localStorage.getItem(FAVORITES_STORAGE_KEY);
    const liste = kayit ? JSON.parse(kayit) : [];
    return Array.isArray(liste) ? liste : [];
  } catch (e) {
    console.warn("Favoriler okunamadı:", e);
    return [];
  }
}

function urunFavoriAnahtari(urun) {
  if (!urun) return "";
  return String(urun.urunKodu || urun.barkod || urun.kod || urun.link || "");
}

function urunFavorideMi(urun) {
  const anahtar = urunFavoriAnahtari(urun);
  return !!anahtar && favoriUrunler.some(function(item) {
    return urunFavoriAnahtari(item) === anahtar;
  });
}

function favorileriKaydet() {
  try {
    localStorage.setItem(FAVORITES_STORAGE_KEY, JSON.stringify(favoriUrunler));
  } catch (e) {
    console.warn("Favoriler kaydedilemedi:", e);
    alert("Favoriler bu cihazda kaydedilemedi. Tarayıcı depolama alanını kontrol edin.");
  }
  favoriSayisiniGuncelle();
}

function favoriSayisiniGuncelle() {
  favoriteCount.textContent = String(favoriUrunler.length);
  favoriteCount.style.display = "flex";
}

function favoriDurumunuGuncelle() {
  if (!seciliUrun) return;
  const favoride = urunFavorideMi(seciliUrun);
  detailFavoriteButton.textContent = favoride
    ? "★ Favorilerden çıkar"
    : "☆ Favorilere ekle";
  detailFavoriteButton.style.background = favoride ? "#fff0c2" : "#fff8e6";
}

function favoriDegistir(urun) {
  const anahtar = urunFavoriAnahtari(urun);
  if (!anahtar) {
    alert("Bu ürün favorilere eklenemedi; ürün kodu bulunamadı.");
    return;
  }

  const mevcutIndex = favoriUrunler.findIndex(function(item) {
    return urunFavoriAnahtari(item) === anahtar;
  });

  if (mevcutIndex >= 0) {
    favoriUrunler.splice(mevcutIndex, 1);
  } else {
    // Aynı ürünü ikinci kez eklememek için ürün anahtarı kontrol edilir.
    favoriUrunler.push(urun);
  }

  favorileriKaydet();
  favoriDurumunuGuncelle();
  mevcutKartYildizlariniGuncelle();

  if (favoritesModal.style.display === "flex") {
    favoriListesiniGoster();
  }
}

function mevcutKartYildizlariniGuncelle() {
  document.querySelectorAll(".product-favorite-button").forEach(function(button) {
    const anahtar = button.dataset.favoriteKey || "";
    const favoride = favoriUrunler.some(function(item) {
      return urunFavoriAnahtari(item) === anahtar;
    });
    button.textContent = favoride ? "★" : "☆";
    button.classList.toggle("is-favorite", favoride);
    button.setAttribute("aria-label", favoride ? "Favorilerden çıkar" : "Favorilere ekle");
  });
}

function favoriListesiniGoster() {
  favoritesResults.innerHTML = "";
  favoritesStatus.textContent = favoriUrunler.length
    ? favoriUrunler.length + " favori ürün"
    : "Favori listen henüz boş.";

  if (!favoriUrunler.length) {
    const empty = document.createElement("div");
    empty.className = "favorites-empty";
    empty.textContent = "⭐ Henüz favori ürün eklemedin. Ürün kartındaki yıldız simgesine dokunarak ürünleri buraya kaydedebilirsin.";
    favoritesResults.appendChild(empty);
    return;
  }

  favoriUrunler.forEach(function(urun) {
    favoritesResults.appendChild(urunKartiOlustur(urun, true));
  });
}

function favoriPenceresiniAc() {
  favoriListesiniGoster();
  favoritesModal.style.display = "flex";
}

function favoriPenceresiniKapat() {
  favoritesModal.style.display = "none";
}

const results =
  document.getElementById("results");

const status =
  document.getElementById("status");

const loadingScreen =
  document.getElementById("loadingScreen");

const loadingTitle =
  document.getElementById("loadingTitle");

const loadingDescription =
  document.getElementById("loadingDescription");

/*************************************************
 * YÜKLENME EKRANI
 *************************************************/

function progressGoster(baslik, aciklama) {
  results.innerHTML = "";

  loadingTitle.textContent = baslik;
  loadingDescription.textContent =
    aciklama || "Lütfen bekleyin.";

  loadingScreen.style.display = "flex";
}

function progressGizle() {
  loadingScreen.style.display = "none";
}

/*************************************************
 * TELEGRAM INIT DATA
 *************************************************/

function getInitData() {
  if (!telegramWebApp) {
    return "";
  }

  return telegramWebApp.initData || "";
}

async function getTelegramInitData() {
  for (let i = 0; i < 20; i++) {
    const initData = getInitData();

    if (initData) {
      return initData;
    }

    await new Promise(function(resolve) {
      setTimeout(resolve, 250);
    });
  }

  return "";
}

/*************************************************
 * YETKİ KONTROL
 *************************************************/


let aktifUyelikTuru = "";

async function miniAppYetkiKontrol() {
  progressGoster(
    "Telegram doğrulanıyor...",
    "Üyelik bilgileriniz kontrol ediliyor."
  );

  try {
    const initData = await getTelegramInitData();

    if (!initData) {
      status.textContent = "❌ Telegram doğrulaması alınamadı.";
      results.innerHTML = "";
      return false;
    }

    const url =
      API_URL +
      "?func=UYELIK_BILGISI" +
      "&initData=" +
      encodeURIComponent(initData);

    const response = await fetch(url);
    const data = await response.json();

    if (!data || data.success !== true || data.authorized !== true) {
      aktifUyelikTuru = "";
      status.textContent = data && data.message
        ? "❌ " + data.message
        : "❌ Kullanım yetkiniz yok.";
      results.innerHTML = "";
      return false;
    }

    aktifUyelikTuru = String(data.uyelik || "")
      .trim()
      .toLocaleUpperCase("tr-TR");

    if (
      aktifUyelikTuru !== "ÜCRETSİZ" &&
      aktifUyelikTuru !== "ÜCRETLİ" &&
      aktifUyelikTuru !== "SÜRESİZ"
    ) {
      aktifUyelikTuru = "";
      status.textContent = "❌ Üyelik türünüz belirlenemedi.";
      results.innerHTML = "";
      return false;
    }

    status.textContent =
      aktifUyelikTuru === "ÜCRETSİZ"
        ? "Ücretsiz deneme üyeliğiniz aktif."
        : "Üyeliğiniz aktif. Ürün aramaya hazır.";

    return true;

  } catch (err) {
    console.error("Üyelik kontrol hatası:", err);
    aktifUyelikTuru = "";
    status.textContent = "❌ Sunucu bağlantısı kurulamadı.";
    return false;

  } finally {
    progressGizle();
  }
}

/*************************************************
 * ÜRÜN ARAMA
 *************************************************/

let sonArama = "";

// Ücretli üyeler için ürün verisi cihazda IndexedDB ile önbelleğe alınır.
const URUN_CACHE_DB = "kisakod_plus_urun_cache_v1";
const URUN_CACHE_STORE = "urunler";
const URUN_CACHE_KEY = "ucretli_tum_urunler";
const URUN_CACHE_SURESI = 6 * 60 * 60 * 1000; // 6 saat

let ucretliUrunVerileri = null;
let ucretliUrunAramaIndeksi = null;

function urunCacheDbAc() {
  return new Promise(function(resolve, reject) {
    if (!("indexedDB" in window)) {
      reject(new Error("Bu cihaz IndexedDB desteklemiyor."));
      return;
    }
    const request = indexedDB.open(URUN_CACHE_DB, 1);
    request.onupgradeneeded = function() {
      const db = request.result;
      if (!db.objectStoreNames.contains(URUN_CACHE_STORE)) {
        db.createObjectStore(URUN_CACHE_STORE, { keyPath: "key" });
      }
    };
    request.onsuccess = function() { resolve(request.result); };
    request.onerror = function() {
      reject(request.error || new Error("Ürün önbelleği açılamadı."));
    };
  });
}

async function urunCacheOku() {
  const db = await urunCacheDbAc();
  return new Promise(function(resolve, reject) {
    const tx = db.transaction(URUN_CACHE_STORE, "readonly");
    const request = tx.objectStore(URUN_CACHE_STORE).get(URUN_CACHE_KEY);
    request.onsuccess = function() {
      resolve(request.result || null);
      db.close();
    };
    request.onerror = function() {
      reject(request.error || new Error("Ürün önbelleği okunamadı."));
      db.close();
    };
  });
}

async function urunCacheKaydet(products) {
  const db = await urunCacheDbAc();
  return new Promise(function(resolve, reject) {
    const tx = db.transaction(URUN_CACHE_STORE, "readwrite");
    tx.objectStore(URUN_CACHE_STORE).put({
      key: URUN_CACHE_KEY,
      savedAt: Date.now(),
      products: products
    });
    tx.oncomplete = function() { db.close(); resolve(true); };
    tx.onerror = function() {
      db.close();
      reject(tx.error || new Error("Ürün önbelleği kaydedilemedi."));
    };
    tx.onabort = function() {
      db.close();
      reject(tx.error || new Error("Ürün önbelleği kaydedilemedi."));
    };
  });
}

function aramaMetniNormalize(value) {
  return String(value === null || value === undefined ? "" : value)
    .toLocaleLowerCase("tr-TR")
    .replace(/ı/g, "i")
    .replace(/İ/g, "i")
    .replace(/ğ/g, "g")
    .replace(/Ğ/g, "g")
    .replace(/ü/g, "u")
    .replace(/Ü/g, "u")
    .replace(/ş/g, "s")
    .replace(/Ş/g, "s")
    .replace(/ö/g, "o")
    .replace(/Ö/g, "o")
    .replace(/ç/g, "c")
    .replace(/Ç/g, "c")
    .trim();
}

function barkodMetniNormalize(value) {
  let str = String(value === null || value === undefined ? "" : value)
    .trim()
    .replace(/\s/g, "")
    .replace(/-/g, "");
  if (str.endsWith(".0")) str = str.substring(0, str.length - 2);
  return str.replace(/\D/g, "");
}

function ucretliAramaIndeksiHazirla(products) {
  ucretliUrunVerileri = Array.isArray(products) ? products : [];
  ucretliUrunAramaIndeksi = ucretliUrunVerileri.map(function(urun) {
    return {
      urun: urun,
      urunKodu: aramaMetniNormalize(urun.urunKodu),
      kod: aramaMetniNormalize(urun.kod),
      fiyat: aramaMetniNormalize(urun.fiyat),
      tarih: aramaMetniNormalize(urun.tarih),
      barkod: barkodMetniNormalize(urun.barkod)
    };
  });
}

function ucretliUrunleriYerelAra(query) {
  const q = aramaMetniNormalize(query);
  const qBarkod = barkodMetniNormalize(query);
  const bulunan = [];
  if (!q || !Array.isArray(ucretliUrunAramaIndeksi)) return bulunan;

  for (let i = 0; i < ucretliUrunAramaIndeksi.length; i++) {
    const item = ucretliUrunAramaIndeksi[i];
    const eslesti =
      item.urunKodu.indexOf(q) !== -1 ||
      item.kod.indexOf(q) !== -1 ||
      item.fiyat.indexOf(q) !== -1 ||
      item.tarih.indexOf(q) !== -1 ||
      (qBarkod && item.barkod.indexOf(qBarkod) !== -1);

    if (eslesti) {
      bulunan.push(item.urun);
      if (bulunan.length >= 20) break;
    }
  }
  return bulunan;
}

async function ucretliUrunJsonIndir(yuklemeEkraniGoster) {
  const initData = await getTelegramInitData();
  if (!initData) throw new Error("Telegram doğrulaması alınamadı.");

  if (yuklemeEkraniGoster) {
    progressGoster(
      "Ürün verileri indiriliyor...",
      "İlk indirme biraz sürebilir. Sonraki aramalar cihazınızda yapılacak."
    );
  }

  const url = API_URL +
    "?func=URUN_JSON_UCRETLİ&initData=" +
    encodeURIComponent(initData) +
    "&t=" + Date.now();

  const response = await fetch(url, { cache: "no-store" });
  const data = await response.json();

  if (!data || data.success !== true || data.authorized !== true ||
      !Array.isArray(data.products)) {
    throw new Error(data && data.message ? data.message : "Ürün verileri alınamadı.");
  }

  ucretliAramaIndeksiHazirla(data.products);
  try {
    await urunCacheKaydet(data.products);
  } catch (cacheError) {
    console.warn("Ürünler indirildi ancak cihaz önbelleğine kaydedilemedi:", cacheError);
  }

  status.textContent = data.products.length + " ürün hazır. Hızlı arama kullanıma hazır.";
  return true;
}

async function ucretliUrunleriHazirla() {
  if (aktifUyelikTuru !== "ÜCRETLİ" && aktifUyelikTuru !== "SÜRESİZ") return;

  try {
    const cache = await urunCacheOku();
    if (cache && Array.isArray(cache.products)) {
      ucretliAramaIndeksiHazirla(cache.products);
      status.textContent = cache.products.length + " ürün hazır. Hızlı arama kullanıma hazır.";

      if (!cache.savedAt || Date.now() - cache.savedAt > URUN_CACHE_SURESI) {
        ucretliUrunJsonIndir(false).catch(function(err) {
          console.warn("Ürün verileri arka planda yenilenemedi:", err);
        });
      }
      return;
    }
  } catch (cacheError) {
    console.warn("Cihaz önbelleği okunamadı; ürünler sunucudan indirilecek:", cacheError);
  }

  await ucretliUrunJsonIndir(true);
}

async function searchProducts(force = false) {

  const query =
    String(searchInput.value || "").trim();

  if (!query) {
    return;
  }

  if (!force && query === sonArama) {
    return;
  }

  sonArama = query;
  searchButton.disabled = true;

  progressGoster(
    "Ürünler aranıyor...",
    "Aradığınız ürünler getiriliyor."
  );

  status.textContent = "";

  try {
    // Ücretli/süresiz üyeler hazır ürün listesi varsa aramayı cihazda yapar.
    if (
      (aktifUyelikTuru === "ÜCRETLİ" || aktifUyelikTuru === "SÜRESİZ") &&
      Array.isArray(ucretliUrunAramaIndeksi)
    ) {
      renderResults(ucretliUrunleriYerelAra(query));
      return;
    }

    const initData = await getTelegramInitData();

    if (!initData) {
      status.textContent = "❌ Telegram doğrulaması alınamadı.";
      results.innerHTML = "";
      return;
    }

    const aramaFonksiyonu =
      (aktifUyelikTuru === "ÜCRETLİ" || aktifUyelikTuru === "SÜRESİZ")
        ? "URUN_ARA_UCRETLİ"
        : "URUN_ARA";

    const url =
      API_URL +
      "?func=" + encodeURIComponent(aramaFonksiyonu) +
      "&initData=" + encodeURIComponent(initData) +
      "&query=" + encodeURIComponent(query);

    const response = await fetch(url);
    const data = await response.json();

    if (!data || data.success !== true) {
      status.textContent =
        data && data.message
          ? "❌ " + data.message
          : "❌ Arama yapılamadı.";

      return;
    }

    if (data.authorized !== true) {
      status.textContent =
        data.message
          ? "❌ " + data.message
          : "❌ Kullanım yetkiniz yok.";

      return;
    }

    renderResults(
      Array.isArray(data.products)
        ? data.products
        : []
    );

  } catch (err) {
    console.error("Ürün arama hatası:", err);

    results.innerHTML =
      '<div class="empty">❌ Bağlantı hatası oluştu.</div>';

    status.textContent = "Bağlantı hatası.";

  } finally {
    progressGizle();
    searchButton.disabled = false;
  }
}

/*************************************************
 * SONUÇLARI GÖSTER
 *************************************************/

let tumUrunler = [];
let gosterilenUrunSayisi = 0;

const ILK_GOSTERIM = 20;
const SONRAKI_GOSTERIM = 10;

function renderResults(data) {
  results.innerHTML = "";

  tumUrunler = Array.isArray(data)
    ? data
    : [];

  gosterilenUrunSayisi = 0;

  if (tumUrunler.length === 0) {
    status.textContent = "❌ Ürün bulunamadı.";

    results.innerHTML =
      '<div class="empty">Ürün bulunamadı.</div>';

    return;
  }

  status.textContent =
    tumUrunler.length + " ürün bulundu.";

  sonrakiUrunleriGoster(ILK_GOSTERIM);
}

function urunKartiOlustur(urun, favoriPenceresinde) {
  const card = document.createElement("div");
  card.className = "product-card";

  const img = document.createElement("img");
  img.className = "product-image";
  img.alt = urun.kod || "Ürün";
  if (urun.link) {
    img.src = urun.link;
  } else {
    img.style.visibility = "hidden";
  }

  const info = document.createElement("div");
  info.className = "product-info";

  const name = document.createElement("div");
  name.className = "product-name";
  name.textContent = urun.kod || "Ürün";

  const code = document.createElement("div");
  code.className = "product-code";
  code.textContent = "🔢 Kod: " + (urun.urunKodu || "");

  const price = document.createElement("div");
  price.className = "product-price";
  price.textContent = "💰 Fiyat: " + (urun.fiyat || "");

  const date = document.createElement("div");
  date.className = "product-date";
  date.textContent = "📅 Satış Tarihi: " + (urun.tarih || "");

  info.appendChild(name);
  info.appendChild(code);
  info.appendChild(price);
  info.appendChild(date);

  const favorite = document.createElement("button");
  favorite.type = "button";
  favorite.className = "product-favorite-button";
  favorite.dataset.favoriteKey = urunFavoriAnahtari(urun);
  favorite.textContent = urunFavorideMi(urun) ? "★" : "☆";
  favorite.classList.toggle("is-favorite", urunFavorideMi(urun));
  favorite.setAttribute("aria-label", urunFavorideMi(urun) ? "Favorilerden çıkar" : "Favorilere ekle");
  favorite.addEventListener("click", function(event) {
    event.stopPropagation();
    favoriDegistir(urun);
  });

  card.appendChild(img);
  card.appendChild(info);
  card.appendChild(favorite);

  card.addEventListener("click", function() {
    if (favoriPenceresinde) favoriPenceresiniKapat();
    showProductDetail(urun);
  });

  return card;
}

function sonrakiUrunleriGoster(adet) {
  const baslangic = gosterilenUrunSayisi;

  const bitis = Math.min(
    gosterilenUrunSayisi + adet,
    tumUrunler.length
  );

  for (let i = baslangic; i < bitis; i++) {
    results.appendChild(urunKartiOlustur(tumUrunler[i], false));
  }

  gosterilenUrunSayisi = bitis;

  status.textContent =
    gosterilenUrunSayisi +
    " / " +
    tumUrunler.length +
    " ürün gösteriliyor.";
}

/*************************************************
 * ÜRÜN DETAY PENCERESİ
 *************************************************/

function showProductDetail(urun) {
  seciliUrun = urun;
  const modal = document.getElementById("productModal");
  const modalImage = document.getElementById("modalImage");

  document.getElementById("modalTitle").textContent =
    urun.kod || "Ürün";

  document.getElementById("modalPrice").textContent =
    urun.fiyat || "";

  document.getElementById("modalCode").textContent =
    urun.urunKodu || "";

  document.getElementById("modalDate").textContent =
    urun.tarih || "";

  if (urun.link) {
    modalImage.src = urun.link;
    modalImage.style.display = "block";
  } else {
    modalImage.removeAttribute("src");
    modalImage.style.display = "none";
  }

  const qr = document.getElementById("qrCode");
  qr.innerHTML = "";

  if (typeof QRCode !== "undefined" && urun.urunKodu) {
    new QRCode(qr, {
      text: String(urun.urunKodu),
      width: 132,
      height: 132,
      correctLevel: QRCode.CorrectLevel.M
    });
  } else {
    qr.textContent = "QR kod oluşturulamadı.";
  }

  favoriDurumunuGuncelle();
  modal.style.display = "flex";
}

function escapeHtml(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

if (window.visualViewport) {

    const height = window.visualViewport.height;

favoriteButton.addEventListener("click", favoriPenceresiniAc);

/*************************************************
 * BARKOD TARAYICI
 *************************************************/

let codeReader = null;
let scannerControls = null;

async function startScanner() {
  const scanner = document.getElementById("scanner");
  const video = document.getElementById("scannerVideo");

  scanner.style.display = "block";

  try {
    codeReader =
      new ZXingBrowser.BrowserMultiFormatReader();

    scannerControls =
      await codeReader.decodeFromVideoDevice(
        undefined,
        video,
        function(result, error) {
          if (result) {
            const barkod = result.getText();

            stopScanner();

            searchInput.value = barkod;
            searchProducts(true);
          }
        }
      );

  } catch (err) {
    console.error(err);
    alert("Kamera açılamadı.");
    stopScanner();
  }
}

/*************************************************
 * SCANNER DURDUR
 *************************************************/

function stopScanner() {
  if (scannerControls) {
    try {
      scannerControls.stop();
    } catch (e) {}

    scannerControls = null;
  }

  if (codeReader) {
    try {
      codeReader.reset();
    } catch (e) {}

    codeReader = null;
  }

  document.getElementById("scanner").style.display = "none";
}

/*************************************************
 * BARKOD BUTONU
 *************************************************/

barcodeButton.addEventListener("click", function() {
  startScanner();
});

/*************************************************
 * SCANNER KAPAT
 *************************************************/

document
  .getElementById("scannerClose")
  .addEventListener("click", function() {
    stopScanner();

if (telegramWebApp) {
  telegramWebApp.BackButton.onClick(function() {
    const modal = document.getElementById("productModal");
    const scanner = document.getElementById("scanner");
    const favorites = document.getElementById("favoritesModal");

    if (scanner.style.display === "block") {
      stopScanner();
      return;
    }

    if (modal.style.display === "flex") {
      modal.style.display = "none";
      return;
    }

    if (favorites.style.display === "flex") {
      favorites.style.display = "none";
      return;
    }

    telegramWebApp.close();
  });
}

 * BAŞLANGIÇ
 *************************************************/

document.addEventListener("DOMContentLoaded", async function() {
  if (!telegramWebApp) {
    status.textContent =
      "❌ Bu uygulama Telegram içinden açılmalıdır.";

    return;
  }

  telegramWebApp.ready();
  telegramWebApp.expand();

  const yetkili = await miniAppYetkiKontrol();

  if (
    yetkili &&
    (aktifUyelikTuru === "ÜCRETLİ" || aktifUyelikTuru === "SÜRESİZ")
  ) {
    try {
      await ucretliUrunleriHazirla();
    } catch (err) {
      console.error("Ücretli ürün verileri hazırlanamadı:", err);
      status.textContent = "⚠️ Ürün listesi indirilemedi. Arama sunucu üzerinden devam edebilir.";
    }
  }
});

/*************************************************
 * SAYFA SONUNA GELİNCE DAHA FAZLA ÜRÜN GÖSTER
 *************************************************/

window.addEventListener("scroll", function() {
  const scrollPosition =
    window.innerHeight + window.scrollY;

  const documentHeight =
    document.documentElement.scrollHeight;

  if (scrollPosition >= documentHeight - 300) {
    if (gosterilenUrunSayisi < tumUrunler.length) {
      sonrakiUrunleriGoster(SONRAKI_GOSTERIM);
    }
  }
});
</script>
